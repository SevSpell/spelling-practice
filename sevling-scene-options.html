.sev-scene .scene-shadow{ position:absolute; height:14px; border-radius:50%; background:rgba(34,26,61,0.22); filter:blur(2px); pointer-events:none; z-index:5; }
.sev-scene .scene-sprite{ position:absolute; transform-origin:50% 100%; will-change:transform; z-index:6; }
.sev-scene .scene-sprite img, .sev-scene .scene-sprite svg{ width:100%; height:100%; display:block; object-fit:contain; }
.sev-scene .front{ z-index:7; }
.sev-scene .scene-puff{ position:absolute; width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,0.85); pointer-events:none; z-index:5; }
.sev-scene .scene-bubble{ position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,0.8); background:rgba(255,255,255,0.15); pointer-events:none; z-index:7; }
.sev-scene .cloud{ position:absolute; filter:drop-shadow(0 4px 3px rgba(60,70,110,0.12)); }
.sev-scene .cloud i{ position:absolute; border-radius:50%; display:block; }
.sev-scene .fish{ position:absolute; left:-12%; }
.sev-scene .fish .fb{ position:absolute; border-radius:50% 45% 45% 50%; }
.sev-scene .fish .ft{ position:absolute; clip-path:polygon(0 50%,100% 0,85% 50%,100% 100%); }
.sev-scene .fish .fe{ position:absolute; border-radius:50%; background:#111; }
@keyframes sc-fall{ from{ transform:translate(0,-20px) rotate(0); } to{ transform:translate(40px,300px) rotate(360deg); } }
@keyframes sc-rise{ from{ transform:translateY(0); opacity:0.9; } to{ transform:translateY(-280px); opacity:0; } }
@keyframes sc-glow{ 0%,100%{ opacity:0.15; transform:translate(0,0); } 50%{ opacity:1; transform:translate(10px,-8px); } }
@keyframes sc-swim{ from{ left:-14%; } to{ left:108%; } }
@keyframes sc-swimr{ from{ left:108%; } to{ left:-14%; } }
@keyframes sc-drift{ from{ left:-40%; } to{ left:110%; } }
@keyframes sc-bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
@keyframes sc-twinkle{ 0%,100%{ opacity:0.25; } 50%{ opacity:1; } }
@keyframes sc-flow{ from{ background-position:0 0; } to{ background-position:0 60px; } }
@keyframes sc-flutter{ 0%{ transform:translate(0,0); } 25%{ transform:translate(30px,-14px); } 50%{ transform:translate(60px,4px); } 75%{ transform:translate(26px,16px); } 100%{ transform:translate(0,0); } }
@keyframes sc-pulse{ 0%,100%{ filter:drop-shadow(0 0 6px var(--g)) drop-shadow(0 0 14px var(--g)) saturate(1.2); } 50%{ filter:drop-shadow(0 0 12px var(--g)) drop-shadow(0 0 26px var(--g)) saturate(1.6) brightness(1.15); } }
@keyframes sc-sway{ 0%,100%{ transform:rotate(-6deg); } 50%{ transform:rotate(6deg); } }
@keyframes sc-scuttle{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(34px); } }
@keyframes sc-ripple{ from{ transform:scale(0.3); opacity:0.8; } to{ transform:scale(1.6); opacity:0; } }
@keyframes sc-spin{ from{ background-position:0 0,0 0,0 0; } to{ background-position:48px 0,48px 0,0 0; } }
@keyframes sc-beam{ 0%,100%{ transform:rotate(-32deg); } 50%{ transform:rotate(32deg); } }
@keyframes sc-laser{ 0%{ transform:rotate(-70deg); opacity:0; } 10%{ opacity:1; } 50%{ transform:rotate(70deg); opacity:1; } 60%{ opacity:0; } 100%{ transform:rotate(-70deg); opacity:0; } }
@keyframes sc-tile{ 0%,100%{ opacity:0.35; } 50%{ opacity:1; } }
@keyframes sc-gullwing{ from{ transform:rotate(-18deg); } to{ transform:rotate(38deg) scaleY(0.75); } }
@keyframes sc-flap{ from{ transform:scaleY(1); } to{ transform:scaleY(-0.5); } }
@keyframes sc-headtilt{ 0%,80%,100%{ transform:rotate(0); } 88%{ transform:rotate(-12deg); } }
`;
const scR = (a,b) => a + Math.random()*(b-a);
const scD = (st, txt, cls) => `<div class="d ${cls||''}" style="${st}">${txt||''}</div>`;
// A fluffy cloud built from overlapping puffs. tint: 'day' or 'sunset'.
function scCloud(top, scale, tint, dur){
  const w = 120*scale, h = 56*scale;
  const fill = tint==='sunset'
    ? 'radial-gradient(circle at 40% 30%, #FFFBF6 0%, #FFE9DA 45%, #F9BFA8 100%)'
    : 'radial-gradient(circle at 40% 30%, #FFFFFF 0%, #FFFFFF 50%, #DCE6F5 100%)';
  const puffs = [[2,30,38],[16,10,52],[40,0,62],[66,14,46],[82,30,34]].map(([x,y,dd])=>{
    const s = dd*scale; return `<i style="left:${x*w/100}px;top:${y*scale}px;width:${s}px;height:${s}px;background:${fill};"></i>`; }).join('');
  const base = `<i style="left:${w*0.04}px;top:${h*0.55}px;width:${w*0.92}px;height:${h*0.45}px;border-radius:${h}px;background:${fill};"></i>`;
  return `<div class="cloud" style="top:${top}px;width:${w}px;height:${h}px;animation:sc-drift ${dur}s linear ${-scR(0,dur)}s infinite;">${puffs}${base}</div>`;
}
function scFish(top, size, c1, c2, stripe, dur, rev){
  const w = 34*size, h = 18*size;
  const body = stripe ? `linear-gradient(90deg, ${c1} 0 28%, ${stripe} 28% 36%, ${c1} 36% 60%, ${stripe} 60% 68%, ${c1} 68%)` : `linear-gradient(180deg, ${c1}, ${c2})`;
  return `<div class="fish" style="top:${top}%;width:${w}px;height:${h}px;z-index:4;animation:${rev?'sc-swimr':'sc-swim'} ${dur}s linear ${-scR(0,dur)}s infinite;">
    <div style="position:absolute;inset:0;transform:scaleX(${rev?-1:1});animation:sc-bob ${scR(1.5,2.5)}s ease-in-out infinite;">
      <div class="ft" style="left:0;top:${h*0.1}px;width:${w*0.34}px;height:${h*0.8}px;background:${c2};"></div>
      <div class="fb" style="left:${w*0.24}px;top:0;width:${w*0.76}px;height:${h}px;background:${body};box-shadow:inset -2px -2px 0 rgba(0,0,0,0.15);"></div>
      <div class="fe" style="left:${w*0.82}px;top:${h*0.3}px;width:${Math.max(2,h*0.18)}px;height:${Math.max(2,h*0.18)}px;"></div>
    </div></div>`;
}
function scTree(left, bottom, scale, kind){
  const w = 78*scale, h = 100*scale;
  const leaf = kind==='apple'
    ? 'radial-gradient(circle at 35% 30%, #B9F08A, #6FC24E 60%, #4A9A36)'
    : 'radial-gradient(circle at 35% 30%, #FFF0F7, #FFC2DB 55%, #F28DB6)';
  const blobs = [[4,26,46],[26,6,52],[48,20,48],[16,38,44],[40,40,46]].map(([x,y,s])=>`<i style="position:absolute;left:${x*scale}px;top:${y*scale}px;width:${s*scale}px;height:${s*scale}px;border-radius:50%;background:${leaf};display:block;"></i>`).join('');
  const fruit = kind==='apple' ? [[18,40],[46,30],[30,58],[58,52],[36,22]].map(([x,y])=>`<i style="position:absolute;left:${x*scale}px;top:${y*scale}px;width:${7*scale}px;height:${7*scale}px;border-radius:50%;background:#E5322D;display:block;"></i>`).join('') : '';
  return `<div class="d" style="left:${left}%;bottom:${bottom}%;width:${w}px;height:${h}px;">
    <i style="position:absolute;left:${w*0.44}px;bottom:0;width:${w*0.12}px;height:${h*0.42}px;background:linear-gradient(90deg,#6B4426,#8E5E36);border-radius:3px;display:block;"></i>${blobs}${fruit}</div>`;
}
function scRock(st, w, h, dark){
  return `<div class="d" style="${st}width:${w}%;height:${h}%;border-radius:46% 54% 30% 36% / 62% 58% 18% 20%;
    background:radial-gradient(circle at 34% 28%, ${dark?'#7C838C':'#9AA1A9'} 0%, ${dark?'#4E545C':'#6B7178'} 40%, #2A2E34 100%);
    box-shadow:inset -10px -12px 0 rgba(0,0,0,0.28), inset 6px 6px 0 rgba(255,255,255,0.08);"></div>`;
}
function scBasket(st, w, h, toys){
  const rim = `<i style="position:absolute;left:-4%;top:0;width:108%;height:10px;border-radius:6px;background:#7D4E25;display:block;z-index:2;"></i>`;
  const body = `<i style="position:absolute;left:0;top:6px;width:100%;bottom:0;border-radius:4px 4px 16px 16px;display:block;z-index:2;
    background:repeating-linear-gradient(45deg,#C8894A 0 6px,#A9692F 6px 12px), #B57A3E;box-shadow:inset 0 -6px 0 rgba(0,0,0,0.15);"></i>`;
  const items = toys.map(([e,x,y,s,r])=>`<span style="position:absolute;left:${x}%;bottom:${y}px;font-size:${s}px;transform:rotate(${r||0}deg);z-index:1;">${e}</span>`).join('');
  return `<div class="d" style="${st}width:${w}px;height:${h}px;">${items}<div style="position:absolute;left:0;right:0;bottom:0;height:${h}px;">${rim}${body}</div></div>`;
}
// Sevling "teddies": small pictures of real Sevlings. SCENE_ART can be set to supply the picture for an id.
function scTeddy(id, x, y, size, rot){
  const src = (typeof window!=='undefined' && window.SCENE_ART) ? window.SCENE_ART(id) : id + '.png';
  return `<img src="${src}" alt="" style="position:absolute;left:${x}%;bottom:${y}px;width:${size}px;height:${size}px;object-fit:contain;transform:rotate(${rot||0}deg);z-index:1;" onerror="this.remove()">`;
}
// A seagull gliding across the sky: white body and head, yellow beak, grey wings with black tips,
// flapping slowly from the shoulder.
function scGull(top, scale, dur){
  const w = 64*scale, h = 34*scale, flap = scR(0.9,1.3), delay = -scR(0,1);
  const wingStyle = (d) => `transform-box:view-box;transform-origin:30px 17px;animation:sc-gullwing ${flap}s ease-in-out ${d}s infinite alternate;`;
  return `<div class="pt" style="left:0;top:${top}px;animation:sc-drift ${dur}s linear ${-scR(0,dur)}s infinite;z-index:2;">
    <svg width="${w}" height="${h}" viewBox="0 0 64 34" style="display:block;overflow:visible;animation:sc-bob ${scR(2,3)}s ease-in-out infinite;">
      <g style="${wingStyle(delay)}"><path d="M30 17 C 24 8, 16 4, 6 5 C 14 9, 20 14, 26 19 Z" fill="#A9AEB8"/><path d="M6 5 C 9 6.5, 11 7.5, 13 8.6 L 10.5 6.2 Z" fill="#222"/></g>
      <path d="M16 19 L 8 16 L 10 21 Z" fill="#F4F4F6" stroke="#8C919C" stroke-width="0.6"/>
      <ellipse cx="29" cy="20" rx="13" ry="5.2" fill="#FFFFFF" stroke="#8C919C" stroke-width="0.7"/>
      <circle cx="42" cy="16.5" r="4.6" fill="#FFFFFF" stroke="#8C919C" stroke-width="0.7"/>
      <path d="M46.2 16 L 52 17.2 L 46.2 18.4 Z" fill="#F4B400"/>
      <circle cx="43.4" cy="15.6" r="0.8" fill="#222"/>
      <g style="${wingStyle(delay)}"><path d="M31 18 C 28 7, 24 0, 14 -3 C 18 4, 22 12, 25 20 Z" fill="#C4C8D0" stroke="#8C919C" stroke-width="0.6"/><path d="M14 -3 C 16 0, 17.5 2.5, 18.6 5 L 16.4 0.4 Z" fill="#222"/></g>
    </svg></div>`;
}
// A small flapping bird silhouette that glides across the sky.
function scFlyingBird(top, scale, dur, col){
  const w = 30*scale;
  const wing = (side) => `<i style="position:absolute;top:0;${side}:0;width:${w/2}px;height:${w/3}px;border-top:${Math.max(3,3.2*scale)}px solid ${col};border-radius:${side==='left'?'100% 0 0 0':'0 100% 0 0'};display:block;"></i>`;
  return `<div class="pt" style="left:0;top:${top}px;animation:sc-drift ${dur}s linear ${-scR(0,dur)}s infinite;z-index:2;">
    <div style="position:relative;width:${w}px;height:${w/3}px;animation:sc-flap ${scR(0.35,0.55)}s ease-in-out infinite alternate;transform-origin:50% 100%;">${wing('left')}${wing('right')}</div></div>`;
}

  petals:(n,ch)=>Array.from({length:n},()=>`<div class="pt" style="z-index:7;left:${scR(-10,90)}%;top:-20px;font-size:${scR(9,15)}px;animation:sc-fall ${scR(7,11)}s linear ${-scR(0,11)}s infinite;">${ch}</div>`).join(''),
  fireflies:(n)=>Array.from({length:n},()=>`<div class="pt" style="left:${scR(2,95)}%;top:${scR(30,85)}%;width:6px;height:6px;border-radius:50%;background:#FFF59A;box-shadow:0 0 10px 3px #FFE95A;animation:sc-glow ${scR(2,4)}s ease-in-out ${-scR(0,4)}s infinite;"></div>`).join(''),
  stars:(n,maxTop)=>Array.from({length:n},()=>`<div class="pt" style="left:${scR(0,98)}%;top:${scR(2,maxTop)}%;width:3px;height:3px;border-radius:50%;background:#fff;animation:sc-twinkle ${scR(1.5,3.5)}s ease-in-out ${-scR(0,3)}s infinite;"></div>`).join(''),
  bubbles:(n)=>Array.from({length:n},()=>{const r=scR(5,12);return `<div class="pt" style="left:${scR(3,95)}%;top:${scR(85,100)}%;width:${r}px;height:${r}px;border-radius:50%;border:2px solid rgba(255,255,255,0.75);animation:sc-rise ${scR(4,8)}s linear ${-scR(0,8)}s infinite;"></div>`}).join(''),
  butterflies:(n)=>Array.from({length:n},()=>`<div class="pt" style="left:${scR(5,70)}%;top:${scR(10,45)}%;font-size:16px;animation:sc-flutter ${scR(6,9)}s ease-in-out ${-scR(0,6)}s infinite;">🦋</div>`).join('')
};

function sceneDefsFor(collection){ return SEVLING_SCENES[collection] || SEVLING_SCENES.farm; }
function sceneDef(collection, id){ const list = sceneDefsFor(collection); return list.find(x=>x.id===id) || list[0]; }
// Moves a Sevling about inside a scene element. frames: { n, b, h } image urls (h already chosen for mood).
// kind: 'wander' (walk along the ground), 'swim' (glide through water), 'pad' (bouncier, sometimes hops),
// 'dance' (hops about a lot). Stops by itself once the scene leaves the page.
function runSevlingScene(scene, frames, kind, opts){
  opts = opts || {};
  const sprite = scene.querySelector('.scene-sprite'), shadow = scene.querySelector('.scene-shadow'), img = sprite.querySelector('img');
  const reduce = !!opts.reduce;
  let faceKey = 'n', nextBlink = performance.now() + 1500, blinkEnd = 0;
  let W = scene.clientWidth, H = scene.clientHeight;
  const size = opts.size || (W < 480 ? 130 : 160);
  sprite.style.width = size+'px'; sprite.style.height = size+'px';
  let x = W/2, y = kind==='swim' ? H*0.3 : 0, dir = 1, target = null, pauseUntil = performance.now() + 700, hopUntil = 0, lastPuff = 0, nextBubble = 0;
  const t0 = performance.now() - Math.random()*4000;
  const hopChance = kind==='dance' ? 1 : kind==='pad' ? 0.5 : 0;
  function puff(px, py){
    const p = document.createElement('div'); p.className = 'scene-puff'; scene.appendChild(p);
    const dx = (Math.random()-0.5)*26, start = performance.now();
    p.style.left = px+'px'; p.style.top = py+'px';
    (function step(){ const k = (performance.now()-start)/500; if(k>=1 || !p.isConnected){ p.remove(); return; }
      p.style.transform = `translate(${dx*k}px,${-12*k}px) scale(${1+k})`; p.style.opacity = 1-k; requestAnimationFrame(step); })();
  }
  function bubble(px, py){
    const b = document.createElement('div'); b.className = 'scene-bubble'; const r = 6 + Math.random()*8;
    b.style.width = b.style.height = r+'px'; b.style.left = px+'px'; b.style.top = py+'px'; scene.appendChild(b);
    const start = performance.now(), drift = (Math.random()-0.5)*20;
    (function step(){ const k = (performance.now()-start)/2200; if(k>=1 || !b.isConnected){ b.remove(); return; }
      b.style.transform = `translate(${Math.sin(k*9)*4 + drift*k}px,${-k*(py+20)}px)`; b.style.opacity = 1-k*0.7; requestAnimationFrame(step); })();
  }
  function tick(now){
    if(!scene.isConnected) return;
    W = scene.clientWidth; H = scene.clientHeight;
    const t = (now - t0)/1000, ground = H - 16;
    let lift = 0, tilt = 0, sx = 1, sy = 1, scale = 1, moving = false;
    if(reduce){
      sy = 1 + Math.sin(t*2)*0.02; tilt = Math.sin(t*0.9)*2;
    } else if(kind==='swim'){
      if(!target && now > pauseUntil) target = { x: size/2 + Math.random()*(W-size), y: 8 + Math.random()*(H*0.8 - size - 16) };
      if(target){
        const dx = target.x-x, dy = target.y-y, dist = Math.hypot(dx,dy);
        if(dist < 3){ target = null; pauseUntil = now + 900 + Math.random()*1400; blinkEnd = now + 200; }
        else { const sp = Math.min(1.5, 0.4 + dist/90); x += dx/dist*sp; y += dy/dist*sp*0.8; dir = dx>0 ? 1 : -1; moving = true; }
      }
      lift = Math.sin(t*2.2)*6; tilt = moving ? dir*8 + Math.sin(t*5)*3 : Math.sin(t*1.6)*4;
      if(now > nextBubble){ nextBubble = now + 500 + Math.random()*900; bubble(x + dir*size*0.25, y + size*0.3); }
    } else {
      if(!target && now > pauseUntil) target = { x: size/2 + 10 + Math.random()*(W-size-20), y: Math.random()*40 };
      if(target){
        const dx = target.x-x, dy = target.y-y, dist = Math.hypot(dx,dy);
        if(dist < 3){
          target = null; pauseUntil = now + (kind==='dance' ? 900 : 1300) + Math.random()*1300; blinkEnd = now + 200;
          if(Math.random() < hopChance) hopUntil = now + (kind==='dance' ? 2200 : 1100);
        } else { x += dx/dist*1.4; y += dy/dist*0.6; dir = dx>0 ? 1 : -1; moving = true; }
      }
      if(moving){
        const fast = kind==='wander' ? 7 : 9, high = kind==='wander' ? 12 : 16;
        lift = Math.abs(Math.sin(t*fast))*high; tilt = dir*5;
        if(kind!=='dance' && Math.abs(Math.sin(t*fast)) < 0.12 && now-lastPuff > 260){ lastPuff = now; puff(x - dir*size*0.25, ground - y - 6); }
      } else if(now < hopUntil){
        const hops = kind==='dance' ? 4 : 2, len = kind==='dance' ? 2200 : 1100;
        const ph = 1 - (hopUntil-now)/len; lift = Math.abs(Math.sin(ph*Math.PI*hops))*34; if(lift < 3){ sy = 0.92; sx = 1.06; }
        if(kind==='dance'){ tilt = Math.sin(ph*Math.PI*hops)*10; if(Math.sin(ph*Math.PI*2) > 0.95) dir = -dir; }
      } else { tilt = Math.sin(t*1.5)*3; sy = 1 + Math.sin(t*2)*0.015; }
      scale = 1 - y/260;
    }
    if(now > nextBlink){ blinkEnd = now + 180; nextBlink = now + 1800 + Math.random()*2400; }
    const want = now < blinkEnd ? 'b' : ((moving || now < hopUntil || kind==='swim') ? 'h' : (Math.sin(t*0.5) < 0 ? 'n' : 'h'));
    if(img && want !== faceKey && frames[want]){ faceKey = want; img.src = frames[want]; }
    const sz = size*scale;
    const top = kind==='swim' ? y : ground - y - sz;
    sprite.style.left = (x - size/2)+'px'; sprite.style.top = (top - (size-sz))+'px';
    sprite.style.transform = `translateY(${-lift}px) rotate(${tilt}deg) scale(${dir*sx*scale},${sy*scale})`;
    if(kind==='swim'){ shadow.style.display = 'none'; }
    else {
      const sh = Math.max(0.45, 1 - lift/90)*scale;
      shadow.style.display = ''; shadow.style.width = (size*0.62*sh)+'px'; shadow.style.left = (x - size*0.31*sh)+'px'; shadow.style.top = (ground - y - 8)+'px'; shadow.style.opacity = sh;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

});

document.querySelectorAll('.sev-scene').forEach(el=>{
  const c = el.dataset.c, s = SEVLING_SCENES[c][+el.dataset.i], w = who[c];
  const kind = s.kind || (c==='sea' ? 'swim' : c==='pets' ? 'pad' : 'wander');
  el.querySelector('.scene-sprite img').src = im(w+'h');
  runSevlingScene(el, { n:im(w+'n'), b:im(w+'b'), h:im(w+'h') }, kind, { size:120 });
});
</script></body></html>
