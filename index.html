<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Spelling Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EE; --rule:#D8E4EA; --margin:#C0394C; --ink:#233246; --ink-soft:#5B6B7D;
    --band:#2F5233; --band-ink:#F2EEE1; --gold:#E3A72E; --correct:#3C8A5B; --wrong:#C0394C;
    --card:#FFFFFF; --card-edge:#CBB994;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Nunito',sans-serif; color:var(--ink);
    background-color:var(--paper);
    background-image:repeating-linear-gradient(to bottom, transparent, transparent 34px, var(--rule) 35px);
    min-height:100vh;
  }
  .page{ max-width:640px; margin:0 auto; padding:2rem 1.5rem 4rem 3rem; position:relative; }
  .page::before{ content:''; position:absolute; left:1.65rem; top:0; bottom:0; width:2px; background:var(--margin); opacity:0.5; }
  h1,h2,h3{ font-family:'Patrick Hand',cursive; font-weight:400; margin:0 0 0.4rem 0; }
  .masthead{ background:var(--band); color:var(--band-ink); border-radius:12px; padding:1.1rem 1.4rem; margin-bottom:1.2rem; }
  .masthead h1{font-size:clamp(1.9rem,7vw,2.5rem);}
  .masthead p{margin:0;opacity:0.85;font-size:0.95rem;}
  .section-title{font-size:1.4rem;color:var(--ink);margin-top:0.2rem;}
  .muted{color:var(--ink-soft);font-size:0.92rem;line-height:1.5;}
  .nav-row{margin-bottom:1.2rem;}
  .tab-active{background:var(--band);color:var(--band-ink);border-color:var(--band);}
  #balance-badge{
    position:fixed; top:0.7rem; right:0.7rem; background:var(--gold); color:#3B2A06; font-weight:800;
    padding:0.45rem 0.8rem; border-radius:999px; box-shadow:0 2px 5px rgba(0,0,0,0.18); cursor:pointer;
    z-index:50; font-size:0.9rem; display:flex; gap:0.5rem; align-items:center;
  }
  .card{ background:var(--card); border:2px dashed var(--card-edge); border-radius:14px; padding:1.1rem 1.3rem; position:relative; margin-bottom:1rem; }
  .card::before{ content:''; position:absolute; top:9px;left:9px; width:9px;height:9px; border-radius:50%; background:var(--paper); box-shadow:inset 0 0 0 2px var(--card-edge); }
  .card.rot-l{transform:rotate(-0.5deg);} .card.rot-r{transform:rotate(0.5deg);}
  button{ font-family:'Nunito',sans-serif; font-weight:700; cursor:pointer; border:none; border-radius:10px; padding:0.85rem 1.2rem; font-size:1rem; min-height:44px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .btn-primary{background:var(--band);color:var(--band-ink);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-secondary{background:var(--paper);color:var(--ink);border:2px solid var(--card-edge);}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:0.5rem 0.7rem;font-weight:600;text-decoration:underline;}
  .btn-block{width:100%;}
  .btn-row{display:flex;gap:0.7rem;flex-wrap:wrap;}
  .mode-btn{ width:100%; text-align:left; background:var(--card); border:2px dashed var(--card-edge); border-radius:14px; padding:1.1rem 1.3rem; margin-bottom:0.9rem; position:relative; }
  .mode-btn::before{ content:''; position:absolute; top:9px;left:9px; width:9px;height:9px; border-radius:50%; background:var(--paper); box-shadow:inset 0 0 0 2px var(--card-edge); }
  .mode-btn strong{display:block;font-family:'Patrick Hand',cursive;font-size:1.3rem;color:var(--band);}
  .mode-btn span{display:block;color:var(--ink-soft);font-size:0.9rem;margin-top:0.2rem;}
  .mode-btn:disabled{opacity:0.45;cursor:not-allowed;}
  .list-chip{ display:flex; align-items:center; justify-content:space-between; gap:0.6rem; padding:0.8rem 1rem; border-radius:10px; border:2px solid var(--card-edge); background:var(--card); margin-bottom:0.6rem; cursor:pointer; }
  .list-chip.selected{border-color:var(--band);background:#F1F5EF;}
  .list-chip .meta{font-size:0.85rem;color:var(--ink-soft);}
  .list-chip .del{background:none;border:none;color:var(--wrong);font-size:0.85rem;text-decoration:underline;min-height:auto;padding:0.2rem;}
  input[type=text], input[type=password], input[type=email]{ font-family:'Nunito',sans-serif; font-size:1.1rem; padding:0.75rem 0.9rem; border-radius:10px; border:2px solid var(--card-edge); width:100%; margin-bottom:0.7rem; }
  textarea.settings-area{ width:100%; font-family:monospace; font-size:0.82rem; padding:0.6rem; border-radius:10px; border:2px solid var(--card-edge); resize:vertical; }
  table.review{width:100%;border-collapse:collapse;margin-bottom:1rem;}
  table.review th{text-align:left;font-size:0.8rem;color:var(--ink-soft);padding-bottom:0.3rem;}
  table.review td{padding:0.25rem 0.3rem 0.25rem 0;}
  table.review input{font-size:0.95rem;padding:0.5rem;margin-bottom:0;}
  table.review .rm{background:none;border:none;color:var(--wrong);font-size:1.3rem;min-height:auto;padding:0.2rem 0.4rem;}
  .progress{font-size:0.9rem;color:var(--ink-soft);margin-bottom:0.4rem;}
  .word-row{display:flex;align-items:center;justify-content:center;gap:0.6rem;flex-wrap:wrap;}
  .practice-word{ font-size:clamp(2rem,10vw,2.9rem); font-weight:800; text-align:center; margin:1rem 0 0.3rem 0; word-break:break-word; }
  .practice-translation{ text-align:center; font-style:italic; color:var(--ink-soft); font-size:1.15rem; margin-bottom:1.3rem; }
  .speak-btn{ background:var(--card);border:2px solid var(--card-edge);border-radius:50%; width:42px;height:42px;font-size:1.1rem;padding:0;flex-shrink:0; }
  .feedback{ text-align:center; font-weight:800; font-size:1.3rem; margin-top:0.9rem; }
  .feedback.ok{color:var(--correct);} .feedback.no{color:var(--wrong);}
  .feedback .answer{display:flex;align-items:center;justify-content:center;gap:0.4rem;font-weight:600;font-size:1rem;color:var(--ink-soft);margin-top:0.4rem;}
  .score-big{font-size:2.6rem;font-family:'Patrick Hand',cursive;text-align:center;color:var(--band);margin:0.4rem 0;}
  .missed-row{display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--rule);font-size:0.95rem;}
  .reward-card{text-align:center;}
  .reward-icon{font-size:3.2rem;}
  .reward-name{font-family:'Patrick Hand',cursive;font-size:1.4rem;color:var(--band);}
  .reward-value{font-weight:800;color:var(--gold);font-size:1.2rem;}
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.8rem;}
  .shop-item{background:var(--card);border:2px dashed var(--card-edge);border-radius:14px;padding:0.9rem 0.6rem;text-align:center;}
  .shop-item.locked{opacity:0.55;}
  .item-emoji{font-size:2.2rem;margin-bottom:0.3rem;}
  .item-name{font-weight:700;font-size:0.9rem;margin-bottom:0.5rem;}
  .item-locked{font-size:0.78rem;color:var(--ink-soft);}
  .item-owned{font-size:0.8rem;color:var(--correct);font-weight:700;}
  .item-btn{width:100%;padding:0.5rem;font-size:0.85rem;}
  .trophy-case{display:flex;justify-content:space-between;text-align:center;}
  .trophy-case > div{font-size:1.3rem;font-weight:800;}
  .trophy-case span{display:block;font-size:0.85rem;color:var(--ink-soft);font-weight:600;}
  .avatar-block{text-align:center;margin-bottom:1rem;}
  .avatar{font-size:4rem;}
  .avatar-outfit{font-weight:700;}
  .room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:0.7rem;}
  .room-tile{background:var(--card);border:2px dashed var(--card-edge);border-radius:12px;padding:0.7rem 0.4rem;text-align:center;}
  .lava-lamp{width:44px;height:70px;margin:0 auto 0.3rem auto;position:relative;}
  .lamp-glass{position:relative;width:100%;height:56px;background:rgba(227,167,46,0.15);border:2px solid var(--card-edge);border-radius:16px 16px 10px 10px;overflow:hidden;}
  .lamp-base{width:56%;height:8px;background:var(--card-edge);margin:0 auto;border-radius:0 0 4px 4px;}
  .blob{position:absolute;left:50%;width:16px;height:16px;background:#E0655A;border-radius:50%;opacity:0.85;animation:lava 4s ease-in-out infinite;}
  .blob.b1{animation-delay:0s;} .blob.b2{width:12px;height:12px;animation-delay:1.3s;background:var(--gold);} .blob.b3{width:10px;height:10px;animation-delay:2.6s;}
  @keyframes lava{ 0%{transform:translate(-50%,46px) scale(1);} 50%{transform:translate(-50%,4px) scale(1.15);} 100%{transform:translate(-50%,46px) scale(1);} }
  .drop-zone{ border:2px dashed var(--card-edge); border-radius:14px; padding:2rem 1rem; text-align:center; background:var(--card); }
  .thumb{max-width:100%;border-radius:10px;margin:0.8rem 0;display:block;}
  .spinner{ width:22px;height:22px;border-radius:50%; border:3px solid var(--card-edge);border-top-color:var(--band); animation:spin 0.8s linear infinite; display:inline-block;vertical-align:middle;margin-right:0.5rem; }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{ background:#FBEAEC;border:2px solid var(--wrong);color:var(--wrong); border-radius:10px;padding:0.8rem 1rem;font-size:0.92rem;margin-bottom:1rem; }
  .ok-box{ background:#EAF3EC;border:2px solid var(--correct);color:var(--correct); border-radius:10px;padding:0.8rem 1rem;font-size:0.92rem;margin-bottom:1rem; }
  .status-line{font-size:0.9rem;margin-top:0.5rem;}
  .signed-in-line{font-size:0.9rem;color:var(--ink-soft);margin:-0.6rem 0 1rem 0;}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} .blob{animation:none;top:20px;} }
</style>
</head>
<body>
<div id="balance-badge"></div>
<div id="app" class="page"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const app = document.getElementById('app');

const SHOP_ITEMS = [
  { id:'cat', name:'Cat', emoji:'\uD83D\uDC31', category:'pet', price:2, unlockAt:0 },
  { id:'dog', name:'Dog', emoji:'\uD83D\uDC36', category:'pet', price:2, unlockAt:0 },

  { id:'scarf', name:'Scarf', emoji:'\uD83E\uDDE3', category:'outfit', price:2, unlockAt:0 },
  { id:'radio', name:'Radio', emoji:'\uD83D\uDCFB', category:'decor', price:3, unlockAt:0 },
  { id:'headphones', name:'Headphones', emoji:'\uD83C\uDFA7', category:'decor', price:2, unlockAt:0 },
  { id:'plant', name:'Plant', emoji:'\uD83E\uDEB4', category:'decor', price:2, unlockAt:0 },
  { id:'rug', name:'Rug', emoji:'\uD83D\uDFEA', category:'decor', price:2, unlockAt:0 },
  { id:'rabbit', name:'Rabbit', emoji:'\uD83D\uDC30', category:'pet', price:3, unlockAt:5 },
  { id:'hamster', name:'Hamster', emoji:'\uD83D\uDC39', category:'pet', price:2, unlockAt:5 },
  { id:'tophat', name:'Top hat', emoji:'\uD83C\uDFA9', category:'outfit', price:3, unlockAt:5 },
  { id:'lavalamp', name:'Lava lamp', emoji:null, category:'decor', price:5, unlockAt:5 },
  { id:'bookshelf', name:'Bookshelf', emoji:'\uD83D\uDCDA', category:'decor', price:3, unlockAt:5 },
  { id:'hedgehog', name:'Hedgehog', emoji:'\uD83E\uDD94', category:'pet', price:3, unlockAt:10 },
  { id:'turtle', name:'Turtle', emoji:'\uD83D\uDC22', category:'pet', price:3, unlockAt:10 },
  { id:'cape', name:'Cape', emoji:'\uD83E\uDDB8', category:'outfit', price:4, unlockAt:10 },
  { id:'guitar', name:'Guitar', emoji:'\uD83C\uDFB8', category:'decor', price:4, unlockAt:10 },
  { id:'parrot', name:'Parrot', emoji:'\uD83E\uDD9C', category:'pet', price:4, unlockAt:15 },
  { id:'wizardhat', name:'Wizard hat', emoji:'\uD83E\uDDD9', category:'outfit', price:5, unlockAt:15 },
  { id:'crown', name:'Crown', emoji:'\uD83D\uDC51', category:'outfit', price:6, unlockAt:20 },
  { id:'gameconsole', name:'Games console', emoji:'\uD83C\uDFAE', category:'decor', price:5, unlockAt:20 },
  { id:'discoball', name:'Disco ball', emoji:'\uD83E\uDE85', category:'decor', price:6, unlockAt:25 },
  { id:'unicorn', name:'Unicorn', emoji:'\uD83E\uDD84', category:'pet', price:8, unlockAt:30 }
];
const TROPHY_ADJ = ['Sparkling','Shining','Golden','Dazzling','Marvellous','Brilliant','Glittering'];

const state = {
  view: 'settings', lists: [], currentListId: null,
  uploadImageB64: null, uploadImagePreview: null, extractedWords: [], listLabelDraft: '',
  busy: false, error: '', settingsMessage: '', firebaseConfigDraft: '', shopTab: 'pet', authMode: 'signin',
  practice: { mode:null, words:[], index:0, score:0, wrong:[], checked:false, lastCorrect:false, input:'', isRetry:false, reward:null, trophyVariant:null, milestoneHit:false }
};

let game = { totalEarned:0, balance:0, medals:{trophy:0,gold:0,silver:0,bronze:0}, inventory:[], equippedOutfit:null };
let settings = { firebaseConfig:null };
let fbApp = null, db = null, auth = null, authUser = null;

const EXTRACT_PROMPT = "This photo shows a child's Spanish vocabulary list, with Spanish words and their English translations, in whatever column order they appear. Read every word pair on the page. Respond with ONLY a valid JSON array, no markdown fences, no commentary, in this exact format: [{\"spanish\":\"palabra\",\"english\":\"word\"}]. Keep the original spelling, capitalisation and accents exactly as written. If a word is hard to read, give your best reading rather than skipping it.";

function uid(){ return 'w' + Date.now() + Math.random().toString(36).slice(2,7); }
function genInviteCode(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
function todayLabel(){ return new Date().toLocaleDateString('en-GB',{ day:'numeric', month:'long', year:'numeric' }); }
function normalise(s){ return (s||'').trim().toLowerCase(); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function speak(text, lang){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakBtn(text, lang){
  return `<button type="button" class="speak-btn" data-text="${escapeHtml(text)}" data-lang="${lang}" aria-label="Listen">\uD83D\uDD0A</button>`;
}
function friendlyAuthError(e){
  const code = e && e.code ? e.code : '';
  const map = {
    'auth/email-already-in-use': 'That email already has an account.',
    'auth/invalid-email': 'That email address looks wrong.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/user-not-found': 'No account found with that username.',
    'auth/invalid-credential': 'Incorrect username or password.',
    'auth/too-many-requests': 'Too many attempts, please wait a moment and try again.',
    'auth/operation-not-allowed': 'Email/Password sign-in is not turned on for this Firebase project yet.'
  };
  return map[code] || (e && e.message) || 'Something went wrong.';
}

// ---------- settings (local, per device) ----------
function loadSettings(){
  try{
    const raw = localStorage.getItem('spelling_settings');
    if(raw) return Object.assign({ firebaseConfig:null }, JSON.parse(raw));
  }catch(e){}
  return { firebaseConfig:null };
}
function saveSettingsToStorage(){
  try{ localStorage.setItem('spelling_settings', JSON.stringify({ firebaseConfig: settings.firebaseConfig })); return true; }
  catch(e){ return false; }
}
async function loadFamilyGeminiKey(){
  try{
    if(!db || !authUser) return '';
    const snap = await getDoc(doc(db,'family','settings'));
    return snap.exists() ? (snap.data().geminiKey || '') : '';
  }catch(e){ return ''; }
}
async function saveFamilyGeminiKey(key){
  if(!db || !authUser){ state.error = 'Sign in first to save the family key.'; return false; }
  try{ await setDoc(doc(db,'family','settings'), { geminiKey: key }); return true; }
  catch(e){ state.error = `Couldn't save the family key (${e.message}).`; return false; }
}
async function loadFamilyInviteCode(){
  try{
    if(!db) return '';
    const snap = await getDoc(doc(db,'family','invite'));
    return snap.exists() ? (snap.data().code || '') : '';
  }catch(e){ return ''; }
}
async function saveFamilyInviteCode(code){
  if(!db || !authUser){ state.error = 'Sign in first to change the invite code.'; return false; }
  try{ await setDoc(doc(db,'family','invite'), { code: code.toUpperCase() }); return true; }
  catch(e){ state.error = `Couldn't save the invite code (${e.message}).`; return false; }
}
function parseFirebaseConfigText(text){
  const grab = (key)=>{
    const m = text.match(new RegExp('["\\\']?' + key + '["\\\']?\\s*:\\s*["\\\']([^"\\\']+)["\\\']'));
    return m ? m[1] : '';
  };
  const config = {
    apiKey: grab('apiKey'), authDomain: grab('authDomain'), projectId: grab('projectId'),
    storageBucket: grab('storageBucket'), messagingSenderId: grab('messagingSenderId'), appId: grab('appId')
  };
  if(!config.apiKey || !config.projectId) return null;
  return config;
}
function initFirebase(config){
  try{
    fbApp = initializeApp(config);
    db = getFirestore(fbApp);
    auth = getAuth(fbApp);
    onAuthStateChanged(auth, (user)=>{ authUser = user; handleAuthChange(); });
    return true;
  }catch(e){ db=null; auth=null; return false; }
}
async function handleAuthChange(){
  if(authUser){
    game = await loadGame();
    settings.geminiKey = await loadFamilyGeminiKey();
    settings.inviteCode = await loadFamilyInviteCode();
    state.lists = (await getIndex()).sort((a,b)=>b.savedAt-a.savedAt);
    if(state.lists.length && !state.currentListId) state.currentListId = state.lists[0].id;
    if(state.view==='login') state.view = 'home';
  }else{
    if(state.view!=='settings') state.view = 'login';
  }
  render();
}

// ---------- Firestore-backed storage, private per signed-in user ----------
// Path shape: spelling_users/{uid}/{kind}/{id} - kind is 'data' (index/game) or 'lists' (one doc per list)
async function fsGet(kind, id){
  if(!db || !authUser) throw new Error('Sign in to sync.');
  const snap = await getDoc(doc(db,'spelling_users', authUser.uid, kind, id));
  return snap.exists() ? snap.data() : null;
}
async function fsSet(kind, id, dataObj){
  if(!db || !authUser) throw new Error('Sign in to sync.');
  await setDoc(doc(db,'spelling_users', authUser.uid, kind, id), dataObj);
}
async function fsDelete(kind, id){
  if(!db || !authUser) throw new Error('Sign in to sync.');
  await deleteDoc(doc(db,'spelling_users', authUser.uid, kind, id));
}

async function getIndex(){
  try{ const d = await fsGet('data','index'); return (d && d.lists) ? d.lists : []; }
  catch(e){ return []; }
}
async function saveIndex(idx){
  try{ await fsSet('data','index', { lists: idx }); }
  catch(e){ state.error = `Saved the list, but the list menu couldn't sync (${e.message}).`; }
}
async function getListWords(id){
  try{ const d = await fsGet('lists', id); return (d && d.words) ? d.words : []; }
  catch(e){ return []; }
}
async function saveNewList(label, words){
  const id = uid();
  try{ await fsSet('lists', id, { words }); }
  catch(e){
    state.error = `Couldn't save this list (${e.message}). Check Settings.`;
    return null;
  }
  const idx = await getIndex();
  idx.push({ id, label, count: words.length, savedAt: Date.now() });
  await saveIndex(idx);
  return id;
}
async function deleteList(id){
  try{ await fsDelete('lists', id); }catch(e){}
  const idx = (await getIndex()).filter(l=>l.id!==id);
  await saveIndex(idx);
}
async function loadGame(){
  const empty = { totalEarned:0, balance:0, medals:{trophy:0,gold:0,silver:0,bronze:0}, inventory:[], equippedOutfit:null };
  try{
    const d = await fsGet('data','game');
    if(d) return Object.assign(empty, d);
  }catch(e){}
  return empty;
}
async function saveGame(){
  try{ await fsSet('data','game', game); }
  catch(e){ state.error = `Your coins couldn't sync (${e.message}).`; }
}

// ---------- image handling ----------
let heicLibLoaded = false;
function ensureHeicLib(){
  return new Promise((resolve, reject)=>{
    if(heicLibLoaded && window.heic2any){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';
    script.onload = ()=>{ heicLibLoaded = true; resolve(); };
    script.onerror = ()=>reject(new Error('Could not load HEIC support.'));
    document.head.appendChild(script);
  });
}
function loadImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file from your device.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1200;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({ b64: dataUrl.split(',')[1], preview: dataUrl });
      };
      img.onerror = ()=>reject(new Error('The browser could not decode that image format.'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function resizeImageToBase64(file){
  try{ return await loadImageFile(file); }
  catch(e){
    try{
      await ensureHeicLib();
      const converted = await window.heic2any({ blob:file, toType:'image/jpeg', quality:0.85 });
      const jpegFile = Array.isArray(converted) ? converted[0] : converted;
      return await loadImageFile(jpegFile);
    }catch(e2){
      throw new Error((e2 && e2.message) ? e2.message : (e && e.message) || 'unknown error');
    }
  }
}
async function extractWords(b64){
  if(!settings.geminiKey) throw new Error('Add a Gemini API key in Settings first.');
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(settings.geminiKey)}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      contents:[{ parts:[
        { text: EXTRACT_PROMPT },
        { inline_data:{ mime_type:'image/jpeg', data:b64 } }
      ]}],
      generationConfig:{ responseMimeType:'application/json' }
    })
  });
  const data = await resp.json();
  if(data.error) throw new Error(data.error.message || 'Gemini API error');
  const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
  let raw = (parts && parts[0] && parts[0].text) ? parts[0].text : '[]';
  raw = raw.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(raw);
  if(!Array.isArray(parsed)) throw new Error('Unexpected response.');
  return parsed.map(w=>({ spanish:(w.spanish||'').trim(), english:(w.english||'').trim() })).filter(w=>w.spanish||w.english);
}

function wireAuthForm(mode){
  document.querySelectorAll('[data-authmode]').forEach(b=>{
    b.onclick = ()=>{ state.authMode = b.dataset.authmode; state.error=''; state.settingsMessage=''; render(); };
  });

      const password = document.getElementById('au-password').value;
      if(!username || !password){ state.error='Enter your username and password.'; render(); return; }
      state.error=''; render();
      try{
        const mapDoc = await getDoc(doc(db,'usernames', username));

        await signInWithEmailAndPassword(auth, mapDoc.data().email, password);
      }catch(e){ state.error = friendlyAuthError(e); render(); }
    };

    document.getElementById('btn-signup').onclick = async ()=>{

      if(!username || !email || !password){ state.error='Fill in every field.'; render(); return; }

      if(password!==confirm){ state.error="Passwords don't match."; render(); return; }
      state.error=''; render();
      try{
        const existing = await getDoc(doc(db,'usernames', usernameKey));
        if(existing.exists()) throw { message:'That username is already taken.' };
        const inviteSnap = await getDoc(doc(db,'family','invite'));
        const isFirstEver = !inviteSnap.exists() || !inviteSnap.data().code;
        if(!isFirstEver){
          const realCode = inviteSnap.data().code;
          if(!inviteInput || inviteInput.toUpperCase() !== String(realCode).toUpperCase()){
            throw { message: 'That invite code doesn\u2019t match. Check with whoever set this up.' };
          }
        }
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        authUser = cred.user;
        await updateProfile(cred.user, { displayName: username });
        await setDoc(doc(db,'usernames', usernameKey), { email, uid: cred.user.uid });
        if(isFirstEver){
          const newCode = inviteInput ? inviteInput.toUpperCase() : genInviteCode();
          await setDoc(doc(db,'family','invite'), { code: newCode });
          state.inviteCodeToShow = newCode;
        }
        if(geminiVal){ await saveFamilyGeminiKey(geminiVal); settings.geminiKey = geminiVal; }
      }catch(e){ state.error = friendlyAuthError(e); render(); }
    };
  }else if(mode==='reset'){
    document.getElementById('btn-reset').onclick = async ()=>{
      const username = document.getElementById('au-username').value.trim().toLowerCase();
      if(!username){ state.error='Enter your username.'; render(); return; }
      state.error=''; state.settingsMessage=''; render();

        await sendPasswordResetEmail(auth, mapDoc.data().email);
        state.settingsMessage = 'A password reset link has been sent to the email on that account.';
      }catch(e){ state.error = friendlyAuthError(e); }
      render();
    };
  }
}

async function startPractice(mode){
  if(!db || !authUser){ state.error = 'Sign in first.'; state.view='login'; render(); return; }
  const words = await getListWords(state.currentListId);
  if(!words.length){ state.error = "That list seems to be empty."; state.view='home'; render(); return; }
  state.practice = { mode, words: shuffle(words), index:0, score:0, wrong:[], checked:false, lastCorrect:false, input:'', isRetry:false, reward:null, trophyVariant:null, milestoneHit:false };
  state.error=''; state.view = 'practice'; render();
}

function renderPractice(){
  const p = state.practice;
  const word = p.words[p.index];
  const isCopy = p.mode === 'copy';
  const shownWord = isCopy ? word.spanish : word.english;
  const shownLang = isCopy ? 'es-ES' : 'en-GB';
  app.innerHTML = `
    <div class="progress">Word ${p.index+1} of ${p.words.length} &nbsp;\u00B7&nbsp; Score ${p.score}</div>
    <div class="card">
      <div class="word-row">
        <div class="practice-word">${escapeHtml(shownWord)}</div>
        ${speakBtn(shownWord, shownLang)}
      </div>
      ${isCopy ? `<div class="practice-translation">${escapeHtml(word.english)}</div>` : ''}
      <input type="text" id="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="Type the Spanish word" ${p.checked ? 'disabled' : ''} value="${escapeHtml(p.input)}">
      ${p.checked ? feedbackHtml(p, word) : ''}
    </div>
    <div class="btn-row">
      ${p.checked
        ? `<button class="btn-primary" id="btn-next">${p.index+1 < p.words.length ? 'Next word' : 'See results'}</button>`
        : `<button class="btn-primary" id="btn-check">Check</button>`}
      <button class="btn-ghost" id="btn-quit">Stop practising</button>
    </div>
  `;
  const input = document.getElementById('answer-input');
  input.focus();
  input.oninput = (e)=>{ p.input = e.target.value; };
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); if(p.checked) nextWord(); else checkAnswer(word); } };
  if(!p.checked){ document.getElementById('btn-check').onclick = ()=>checkAnswer(word); }
  else{ document.getElementById('btn-next').onclick = ()=>nextWord(); }
  document.getElementById('btn-quit').onclick = ()=>{ if(confirm('Stop this practice session?')){ state.view='home'; render(); } };
}
function feedbackHtml(p, word){
  if(p.lastCorrect) return `<div class="feedback ok">Correct!</div>`;
  return `<div class="feedback no">Not quite<span class="answer">Correct spelling: ${escapeHtml(word.spanish)} ${speakBtn(word.spanish,'es-ES')}</span></div>`;
}
function checkAnswer(word){
  const p = state.practice;
  const correct = normalise(p.input) === normalise(word.spanish);
  p.checked = true; p.lastCorrect = correct;
  if(correct) p.score++; else p.wrong.push(word);
  render();
}
function computeReward(wrongCount){
  if(wrongCount===0) return { type:'trophy', value:5 };
  if(wrongCount===1) return { type:'gold', value:3 };
  if(wrongCount===2) return { type:'silver', value:2 };
  if(wrongCount>=3 && wrongCount<=4) return { type:'bronze', value:1 };
  return null;
}
function randomTrophyVariant(){
  return { adj: TROPHY_ADJ[Math.floor(Math.random()*TROPHY_ADJ.length)], hue: Math.floor(Math.random()*360), emoji: Math.random()<0.5 ? '\uD83C\uDFC6' : '\uD83C\uDFC5' };
}
async function nextWord(){
  const p = state.practice;
  if(p.index+1 < p.words.length){
    p.index++; p.checked = false; p.lastCorrect = false; p.input = ''; render(); return;
  }
  if(!p.isRetry){
    const reward = computeReward(p.wrong.length);
    p.reward = reward;
    if(reward){
      const before = game.totalEarned;
      game.totalEarned += reward.value; game.balance += reward.value; game.medals[reward.type]++;
      p.milestoneHit = Math.floor(game.totalEarned/5) > Math.floor(before/5);
      p.trophyVariant = reward.type==='trophy' ? randomTrophyVariant() : null;
      await saveGame();
    }
  }else{ p.reward = null; }
  state.view = 'results'; render();
}
function rewardBlockHtml(p){
  if(!p.reward) return `<div class="card"><p class="muted" style="text-align:center;margin:0;">No reward this time, get 4 or fewer wrong next time to win one.</p></div>`;
  const r = p.reward;
  let inner;
  if(r.type==='trophy'){
    const v = p.trophyVariant;
    inner = `<div class="reward-icon" style="filter:hue-rotate(${v.hue}deg) saturate(1.4);">${v.emoji}</div><div class="reward-name">${v.adj} Trophy</div><div class="reward-value">+\u00A3${r.value}</div>`;
  }else{
    const icons = { gold:'\uD83E\uDD47', silver:'\uD83E\uDD48', bronze:'\uD83E\uDD49' };
    const names = { gold:'Gold coin', silver:'Silver coin', bronze:'Bronze coin' };
    inner = `<div class="reward-icon">${icons[r.type]}</div><div class="reward-name">${names[r.type]}</div><div class="reward-value">+\u00A3${r.value}</div>`;
  }
  return `<div class="card reward-card">${inner}</div>
    ${p.milestoneHit ? `<div class="card" style="background:#FBF3DC;border-color:var(--gold);"><p style="margin:0;text-align:center;font-weight:700;">New items have unlocked in the shop!</p></div>` : ''}`;
}
function renderResults(){
  const p = state.practice;
  const total = p.words.length;
  const pct = Math.round((p.score/total)*100);
  let message = "Keep practising, you'll get there.";
  if(pct===100) message = '\u00A1Perfecto! Every word spelt correctly.';
  else if(pct>=80) message = '\u00A1Muy bien! A really strong effort.';
  else if(pct>=50) message = 'Good progress, a bit more practice will help.';
  app.innerHTML = `
    <h2 class="section-title">Well done!</h2>
    <div class="card">
      <div class="score-big">${p.score} / ${total}</div>
      <p class="muted" style="text-align:center;">${message}</p>
    </div>
    ${p.isRetry ? '' : rewardBlockHtml(p)}
    ${p.wrong.length ? `
      <h3 class="section-title">Words to look at again</h3>
      <div class="card">${p.wrong.map(w=>`<div class="missed-row"><span>${escapeHtml(w.spanish)}</span><span class="muted">${escapeHtml(w.english)}</span></div>`).join('')}</div>
    ` : ''}
    <div class="btn-row" style="margin-top:1rem;">
      ${p.wrong.length ? `<button class="btn-primary" id="btn-retry">Practise the missed words</button>` : ''}
      ${(!p.isRetry && p.reward) ? `<button class="btn-secondary" id="btn-shop">Go to the shop</button>` : ''}
      <button class="btn-secondary" id="btn-home">Back to lists</button>
    </div>
  `;
  if(p.wrong.length){
    document.getElementById('btn-retry').onclick = ()=>{
      state.practice = { mode: p.mode, words: shuffle(p.wrong), index:0, score:0, wrong:[], checked:false, lastCorrect:false, input:'', isRetry:true, reward:null, trophyVariant:null, milestoneHit:false };
      state.view='practice'; render();
    };
  }
  const shopBtn = document.getElementById('btn-shop');
  if(shopBtn) shopBtn.onclick = ()=>{ state.view='shop'; render(); };
  document.getElementById('btn-home').onclick = ()=>{ state.view='home'; render(); };
}

function shopItemCard(item){
  const locked = game.totalEarned < item.unlockAt;
  const owned = game.inventory.includes(item.id);
  const worn = item.category==='outfit' && game.equippedOutfit===item.id;
  const icon = item.id==='lavalamp' ? lavaLampHtml() : `<div class="item-emoji">${item.emoji}</div>`;
  let action = '';
  if(locked) action = `<div class="item-locked">\uD83D\uDD12 Unlocks at \u00A3${item.unlockAt}</div>`;
  else if(owned) action = item.category==='outfit'
    ? `<button class="btn-secondary item-btn" data-wear="${item.id}">${worn ? 'Worn' : 'Wear'}</button>`
    : `<div class="item-owned">In your room</div>`;
  else action = `<button class="btn-primary item-btn" data-buy="${item.id}" ${game.balance<item.price?'disabled':''}>Buy \u00A3${item.price}</button>`;
  return `<div class="shop-item ${locked?'locked':''}">${icon}<div class="item-name">${escapeHtml(item.name)}</div>${action}</div>`;
}
function renderShop(){
  const cat = state.shopTab || 'pet';
  const categories = [['pet','Pets'],['outfit','Outfits'],['decor','Room decor']];
  app.innerHTML = `
    ${navRow('shop')}
    <h2 class="section-title">Shop</h2>
    <p class="muted">Spend your coins on pets, outfits and room decorations.</p>
    <div class="btn-row" style="margin-bottom:1rem;">
      ${categories.map(([id,label])=>`<button class="btn-secondary ${cat===id?'tab-active':''}" data-cat="${id}">${label}</button>`).join('')}
    </div>
    <div class="shop-grid">${SHOP_ITEMS.filter(it=>it.category===cat).map(shopItemCard).join('')}</div>
  `;
  document.querySelectorAll('[data-cat]').forEach(b=>{ b.onclick = ()=>{ state.shopTab = b.dataset.cat; render(); }; });
  document.querySelectorAll('[data-buy]').forEach(b=>{
    b.onclick = async ()=>{
      const item = SHOP_ITEMS.find(i=>i.id===b.dataset.buy);
      if(!item || game.balance<item.price) return;
      game.balance -= item.price; game.inventory.push(item.id);
      if(item.category==='outfit' && !game.equippedOutfit) game.equippedOutfit = item.id;
      await saveGame(); render();
    };
  });
  document.querySelectorAll('[data-wear]').forEach(b=>{
    b.onclick = async ()=>{
      game.equippedOutfit = game.equippedOutfit===b.dataset.wear ? null : b.dataset.wear;
      await saveGame(); render();
    };
  });
}

function roomTile(item){
  const icon = item.id==='lavalamp' ? lavaLampHtml() : `<div class="item-emoji">${item.emoji}</div>`;
  return `<div class="room-tile">${icon}<div class="item-name">${escapeHtml(item.name)}</div></div>`;
}
function renderRoom(){
  const pets = SHOP_ITEMS.filter(i=>i.category==='pet' && game.inventory.includes(i.id));
  const decor = SHOP_ITEMS.filter(i=>i.category==='decor' && game.inventory.includes(i.id));
  const outfit = SHOP_ITEMS.find(i=>i.id===game.equippedOutfit);
  app.innerHTML = `
    ${navRow('room')}
    <h2 class="section-title">My room</h2>
    <div class="card">
      <h3 style="margin-top:0;">Trophy case</h3>
      <div class="trophy-case">
        <div>\uD83C\uDFC6<span>${game.medals.trophy}</span></div>
        <div>\uD83E\uDD47<span>${game.medals.gold}</span></div>
        <div>\uD83E\uDD48<span>${game.medals.silver}</span></div>
        <div>\uD83E\uDD49<span>${game.medals.bronze}</span></div>
      </div>
    </div>
    <div class="avatar-block">
      <div class="avatar">\uD83E\uDDD1</div>
      ${outfit ? `<div class="avatar-outfit">${outfit.emoji} ${escapeHtml(outfit.name)}</div>` : `<div class="avatar-outfit muted">No outfit worn</div>`}
    </div>
    ${(pets.length||decor.length) ? `<div class="room-grid">${pets.map(roomTile).join('')}${decor.map(roomTile).join('')}</div>`
      : `<p class="muted">Nothing here yet, visit the shop to decorate your room.</p>`}
  `;
}

function renderSettings(){
  const connected = !!db;
  app.innerHTML = `
    ${authUser ? navRow('settings') : ''}
    <h2 class="section-title">Settings</h2>
    ${state.error ? `<div class="error-box">${state.error}</div>` : ''}
    ${state.settingsMessage ? `<div class="ok-box">${state.settingsMessage}</div>` : ''}

    <div class="card">
      <h3 style="margin-top:0;">Photo reading (Gemini, optional)</h3>
      <p class="muted">Only needed if you want photos read automatically, you can skip this and add words by hand, or add a key later from the photo upload screen. This key is shared with everyone in your family once saved. Sign in at aistudio.google.com, click \u2018Get API key\u2019, create a free key, and paste it here.</p>
      <input type="text" id="gemini-key" placeholder="Family Gemini API key" value="${escapeHtml(settings.geminiKey||'')}" ${authUser ? '' : 'disabled'}>
      ${!authUser ? `<p class="muted" style="margin-top:-0.5rem;">Sign in first to save this, it lives on your family account rather than this device.</p>` : ''}
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Family invite code</h3>
      <p class="muted">Required for anyone new to sign up, this stops strangers creating accounts if the link ever gets shared outside your family. Change it any time to stop an old code working.</p>
      <input type="text" id="invite-code" placeholder="Invite code" value="${escapeHtml(settings.inviteCode||'')}" ${authUser ? '' : 'disabled'}>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Sync and accounts (Firebase)</h3>
      <p class="muted">In the Firebase console: create a free project, add a Web app, turn on Firestore Database, and turn on Email/Password sign-in under Authentication. Paste the whole firebaseConfig snippet below.</p>
      <textarea class="settings-area" id="firebase-config" rows="6">${escapeHtml(state.firebaseConfigDraft || (settings.firebaseConfig ? JSON.stringify(settings.firebaseConfig, null, 2) : ''))}</textarea>
      <p class="status-line">Status: ${connected ? '\uD83D\uDFE2 Connected' : '\u26AA Not connected yet'}</p>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btn-save-settings">Save settings</button>
    </div>
  `;
  document.getElementById('btn-save-settings').onclick = async ()=>{
    const geminiVal = document.getElementById('gemini-key').value.trim();
    const cfgText = document.getElementById('firebase-config').value.trim();
    state.firebaseConfigDraft = cfgText;
    state.error = ''; state.settingsMessage = '';
    if(authUser && geminiVal !== settings.geminiKey){
      const ok = await saveFamilyGeminiKey(geminiVal);
      if(ok) settings.geminiKey = geminiVal;
      else { render(); return; }
    }
    const inviteVal = document.getElementById('invite-code').value.trim();
    if(authUser && inviteVal && inviteVal.toUpperCase() !== (settings.inviteCode||'').toUpperCase()){
      const ok2 = await saveFamilyInviteCode(inviteVal);
      if(ok2) settings.inviteCode = inviteVal.toUpperCase();
      else { render(); return; }
    }
    if(cfgText){
      const parsed = parseFirebaseConfigText(cfgText);
      if(!parsed){
        state.error = "Couldn't find a valid Firebase config in that text, make sure you pasted the whole snippet.";
        render(); return;
      }
      settings.firebaseConfig = parsed;
      const ok = initFirebase(parsed);
      if(!ok){
        state.error = 'That Firebase config looks right, but the connection could not be started.';
        render(); return;
      }
    }
    saveSettingsToStorage();
    state.settingsMessage = 'Settings saved.';
    if(!authUser) state.view = 'login';
    render();
  };
}

init();
</script>
