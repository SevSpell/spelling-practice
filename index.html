<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SevSpell</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="SevSpell">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#221A3D">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5FF; --surface:#FFFFFF; --border:var(--ink);
    --ink:#221A3D; --ink-soft:#6B6289;
    --pink:#FF3EA5; --blue:#00C2FF; --lime:#C4FF3D;
    --band:#FF3EA5; --band-two:#00C2FF; --band-ink:#221A3D;
    --gold:#FFD447; --gold-ink:#A6700A; --mint:#E4DCFF;
    --correct:#1FAE6B; --wrong:#E8367B; --accent-warn:#E8791A;
    --holo:linear-gradient(120deg, #FF3EA5, #00C2FF, #FFD447, #C4FF3D);
    --shadow-ink:3px 3px 0 var(--ink); --shadow-ink-sm:2px 2px 0 var(--ink); --shadow-ink-press:1px 1px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',sans-serif; color:var(--ink); background-color:var(--bg); min-height:100vh;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(255,62,165,0.18), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(0,194,255,0.16), transparent 40%),
      radial-gradient(circle at 12% 88%, rgba(196,255,61,0.18), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(255,212,71,0.20), transparent 40%);
    background-attachment:fixed;
  }
  .page{ max-width:640px; margin:0 auto; padding:2rem 1.5rem 4rem 1.5rem; position:relative; }
  h1,h2,h3{ font-family:'Baloo 2',sans-serif; font-weight:700; margin:0 0 0.4rem 0; }
  .masthead{ position:relative; background:var(--holo); color:var(--band-ink); border:2px solid var(--ink); border-radius:16px; box-shadow:var(--shadow-ink); padding:1.3rem 1.5rem; margin-bottom:1.3rem; }
  .masthead h1{font-size:clamp(1.9rem,7vw,2.5rem);}
  .masthead p{margin:0;opacity:0.85;font-size:0.95rem;}
  .login-masthead{text-align:center;}
  .login-logo{display:block;margin:0 auto 0.5rem auto;max-width:230px;width:70%;height:auto;}
  .login-masthead p{text-align:center;}
  .section-title{font-size:1.4rem;color:var(--ink);margin-top:0.2rem;}
  .muted{color:var(--ink-soft);font-size:0.92rem;line-height:1.5;}
  .nav-row{margin-bottom:1.2rem;}
  .tab-active{background:var(--band-two);color:var(--band-ink);border-color:var(--ink);}
  #logo-badge{
    position:fixed; top:0.7rem; left:0.7rem; z-index:50; width:34px; height:34px; border-radius:50%;
    background:var(--surface); border:2px solid var(--ink); box-shadow:var(--shadow-ink-sm);
    padding:4px; display:flex; align-items:center; justify-content:center;
  }
  #logo-badge img{ width:100%; height:100%; object-fit:contain; display:block; }
  #balance-badge{
    position:fixed; top:0.7rem; right:0.7rem; background:var(--gold); color:var(--ink); font-weight:800;
    padding:0.45rem 0.8rem; border-radius:999px; border:2px solid var(--ink); box-shadow:var(--shadow-ink-sm); cursor:pointer;
    z-index:50; font-size:0.9rem; display:flex; gap:0.5rem; align-items:center;
  }
  .card{ background:var(--surface); border:2px solid var(--ink); border-radius:16px; box-shadow:var(--shadow-ink); padding:1.1rem 1.3rem; position:relative; margin-bottom:1rem; }
  .card.reward-card{ box-shadow:3px 3px 0 var(--gold); }
  button{ font-family:'Inter',sans-serif; font-weight:700; cursor:pointer; border:2px solid var(--ink); border-radius:16px; padding:0.85rem 1.2rem; font-size:1rem; min-height:44px; box-shadow:var(--shadow-ink); background:var(--surface); color:var(--ink); transition:transform 0.06s ease, box-shadow 0.06s ease; }
  button:active{ transform:translate(2px,2px); box-shadow:var(--shadow-ink-press); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:3px solid var(--pink); outline-offset:2px; }
  .btn-primary{background:var(--holo);color:var(--ink);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-secondary{background:var(--surface);color:var(--ink);border:2px solid var(--ink);}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:0.5rem 0.7rem;font-weight:600;text-decoration:underline;border:none;box-shadow:none;min-height:auto;}
  .btn-ghost:active{transform:none;box-shadow:none;}
  .btn-block{width:100%;}
  .btn-row{display:flex;gap:0.7rem;flex-wrap:wrap;}
  .mode-btn{ width:100%; text-align:left; background:var(--surface); border:2px solid var(--ink); border-radius:16px; box-shadow:var(--shadow-ink); padding:1.1rem 1.3rem; margin-bottom:0.9rem; position:relative; transition:transform 0.06s ease, box-shadow 0.06s ease; }
  .mode-btn:active{ transform:translate(2px,2px); box-shadow:var(--shadow-ink-press); }
  .mode-btn strong{display:block;font-family:'Baloo 2',sans-serif;font-size:1.3rem;color:var(--ink);}
  .mode-btn span{display:block;color:var(--ink-soft);font-size:0.9rem;margin-top:0.2rem;}
  .mode-btn:disabled{opacity:0.45;cursor:not-allowed;}
  .list-chip{ display:flex; align-items:center; justify-content:space-between; gap:0.6rem; padding:0.8rem 1rem; border-radius:16px; border:2px solid var(--ink); box-shadow:var(--shadow-ink-sm); background:var(--surface); margin-bottom:0.6rem; cursor:pointer; transition:transform 0.06s ease, box-shadow 0.06s ease; }
  .list-chip:active{ transform:translate(2px,2px); box-shadow:var(--shadow-ink-press); }
  .list-chip.selected{border-color:var(--pink);background:rgba(255,62,165,0.06);}
  .list-chip .meta{font-size:0.85rem;color:var(--ink-soft);}
  .list-chip .del{background:none;border:none;box-shadow:none;color:var(--wrong);font-size:0.85rem;text-decoration:underline;min-height:auto;padding:0.2rem;}
  input[type=text], input[type=password], input[type=email]{ font-family:'Inter',sans-serif; font-size:1.1rem; padding:0.75rem 0.9rem; border-radius:12px; border:2px solid var(--ink); width:100%; margin-bottom:0.7rem; background:#fff; color:#000; }
  select{ font-family:'Inter',sans-serif; font-size:1rem; padding:0.7rem 0.8rem; border-radius:12px; border:2px solid var(--ink); width:100%; margin-bottom:0.7rem; background:#fff; color:#000; }
  textarea.settings-area{ width:100%; font-family:monospace; font-size:0.82rem; padding:0.6rem; border-radius:12px; border:2px solid var(--ink); resize:vertical; background:#fff; color:#000; }
  table.review{width:100%;border-collapse:collapse;margin-bottom:1rem;}
  table.review th{text-align:left;font-size:0.8rem;color:var(--ink-soft);padding-bottom:0.3rem;}
  table.review td{padding:0.25rem 0.3rem 0.25rem 0;}
  table.review input{font-size:0.95rem;padding:0.5rem;margin-bottom:0;background:#fff;color:#000;}
  table.review .rm{background:none;border:none;box-shadow:none;color:var(--wrong);font-size:1.3rem;min-height:auto;padding:0.2rem 0.4rem;}
  .progress{font-size:0.9rem;color:var(--ink-soft);margin-bottom:0.4rem;}
  .word-row{display:flex;align-items:center;justify-content:center;gap:0.6rem;flex-wrap:wrap;}
  .practice-word{ font-family:'Baloo 2',sans-serif; font-size:clamp(2rem,10vw,2.9rem); font-weight:700; text-align:center; margin:1rem 0 0.3rem 0; word-break:break-word; min-height:1.2em; transition:opacity 0.45s ease; }
  .practice-word.word-faded{ opacity:0; }
  .practice-translation{ text-align:center; font-style:italic; color:var(--ink-soft); font-size:1.15rem; margin-bottom:1.3rem; }
  .speak-btn{ background:var(--surface);border:2px solid var(--ink);box-shadow:var(--shadow-ink-sm);border-radius:50%; width:42px;height:42px;font-size:1.1rem;padding:0;flex-shrink:0; }
  .speak-btn:active{ transform:translate(1px,1px); box-shadow:none; }
  .feedback{ text-align:center; font-weight:800; font-size:1.3rem; margin-top:0.9rem; }
  .feedback.ok{color:var(--correct);} .feedback.no{color:var(--wrong);}
  .feedback.ok.accent-note{color:var(--accent-warn);}
  .feedback .answer{display:flex;align-items:center;justify-content:center;gap:0.4rem;font-weight:600;font-size:1rem;color:var(--ink-soft);margin-top:0.4rem;}
  .answer-note{font-weight:600;font-size:1rem;color:var(--accent-warn);margin-top:0.5rem;}
  .answer-word{text-align:center;font-weight:700;font-size:1.3rem;color:var(--accent-warn);margin-top:0.3rem;}
  .answer-word .speak-btn{vertical-align:middle;margin-left:0.4rem;}
  .accent-letter{color:var(--blue);}
  .score-big{font-size:2.6rem;font-family:'Baloo 2',sans-serif;text-align:center;color:var(--blue);margin:0.4rem 0;}
  .missed-row{display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid rgba(34,26,61,0.14);font-size:0.95rem;}
  .reward-card{text-align:center;}
  .reward-icon{font-size:3.2rem;}
  .reward-name{font-family:'Baloo 2',sans-serif;font-size:1.4rem;color:var(--ink);}
  .reward-value{font-weight:800;color:var(--gold-ink);font-size:1.2rem;}
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.8rem;}
  .shop-item{background:var(--surface);border:2px solid var(--ink);box-shadow:var(--shadow-ink-sm);border-radius:16px;padding:0.9rem 0.6rem;text-align:center;transition:transform 0.06s ease, box-shadow 0.06s ease;}
  .shop-item:active{transform:translate(2px,2px);box-shadow:none;}
  .shop-item.locked{opacity:0.55;}
  .item-emoji{font-size:2.2rem;margin-bottom:0.3rem;}
  .item-name{font-weight:700;font-size:0.9rem;margin-bottom:0.5rem;}
  .item-locked{font-size:0.78rem;color:var(--ink-soft);}
  .item-owned{font-size:0.8rem;color:var(--correct);font-weight:700;}
  .item-btn{width:100%;padding:0.5rem;font-size:0.85rem;}
  .trophy-case{display:flex;justify-content:space-between;text-align:center;}
  .trophy-case > div{font-size:1.3rem;font-weight:800;}
  .trophy-case span{display:block;font-size:0.85rem;color:var(--ink-soft);font-weight:600;}
  .avatar-block{text-align:center;margin-bottom:1rem;}
  .avatar{font-size:4rem;}
  .avatar-outfit{font-weight:700;}
  .room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:0.7rem;}
  .room-tile{background:var(--surface);border:2px solid var(--ink);box-shadow:var(--shadow-ink-sm);border-radius:16px;padding:0.7rem 0.4rem;text-align:center;}
  .lava-lamp{width:44px;height:70px;margin:0 auto 0.3rem auto;position:relative;}
  .lamp-glass{position:relative;width:100%;height:56px;background:rgba(0,194,255,0.1);border:2px solid var(--ink);border-radius:16px 16px 10px 10px;overflow:hidden;}
  .lamp-base{width:56%;height:8px;background:var(--mint);margin:0 auto;border-radius:0 0 4px 4px;}
  .blob{position:absolute;left:50%;width:16px;height:16px;background:var(--band-two);border-radius:50%;opacity:0.85;animation:lava 4s ease-in-out infinite;}
  .blob.b1{animation-delay:0s;} .blob.b2{width:12px;height:12px;animation-delay:1.3s;background:var(--gold);} .blob.b3{width:10px;height:10px;animation-delay:2.6s;background:var(--band);}
  @keyframes lava{ 0%{transform:translate(-50%,46px) scale(1);} 50%{transform:translate(-50%,4px) scale(1.15);} 100%{transform:translate(-50%,46px) scale(1);} }
  .drop-zone{ border:2px solid var(--ink); box-shadow:var(--shadow-ink); border-radius:16px; padding:2rem 1rem; text-align:center; background:var(--surface); }
  .thumb{max-width:100%;border-radius:12px;margin:0.8rem 0;display:block;}
  .spinner{ width:22px;height:22px;border-radius:50%; border:3px solid rgba(34,26,61,0.15);border-top-color:var(--band-two); animation:spin 0.8s linear infinite; display:inline-block;vertical-align:middle;margin-right:0.5rem; }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{ background:rgba(232,54,123,0.08);border:2px solid var(--wrong);box-shadow:var(--shadow-ink);color:var(--wrong); border-radius:12px;padding:0.8rem 1rem;font-size:0.92rem;margin-bottom:1rem; }
  .ok-box{ background:rgba(31,174,107,0.08);border:2px solid var(--correct);box-shadow:var(--shadow-ink);color:var(--correct); border-radius:12px;padding:0.8rem 1rem;font-size:0.92rem;margin-bottom:1rem; }
  .status-line{font-size:0.9rem;margin-top:0.5rem;}
  .signed-in-line{font-size:0.9rem;color:var(--ink-soft);margin:-0.6rem 0 1rem 0;}
  .sevling-icon{ display:flex; align-items:center; justify-content:center; }
  .item-emoji.sevling-icon{ width:2.6rem; height:2.6rem; margin:0 auto 0.3rem auto; }
  .reward-icon.sevling-icon{ width:4rem; height:4rem; margin:0.2rem auto; }
  .sevling-icon svg, .sevling-icon img{ width:100%; height:100%; display:block; object-fit:contain; }
  .sevling-locked-img{ filter:brightness(0); }
  .sevling-worn-badges{ font-size:0.95rem; margin-bottom:0.2rem; }
  .game-card{ padding:0.5rem; }
  .game-stage{ position:relative; width:100%; max-width:560px; margin:0 auto; border:2px solid var(--ink); border-radius:12px; overflow:hidden; background:var(--bg); }
  .game-canvas{ display:block; width:100%; height:100%; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:pointer; }
  .game-face{ position:absolute; aspect-ratio:1/1; transform:translate(-50%,-50%); border-radius:50%; border:2px solid var(--ink); background:#fff; overflow:hidden; pointer-events:none; z-index:2; }
  .racer-prompt{ position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; padding:0.7rem; background:rgba(34,26,61,0.38); overflow:auto; }
  .racer-prompt-card{ width:100%; max-width:360px; margin:0; padding:0.9rem 1rem; }
  .racer-prompt-card .practice-word{ font-size:clamp(1.6rem,8vw,2.3rem); }
  .racer-prompt-card input[type=text]{ margin-bottom:0.6rem; }
  .racer-steer{ max-width:360px; margin:1rem auto 0; display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
  .racer-steer button{ font-size:2rem; padding:1.2rem 0; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .racer-list-row{ cursor:pointer; }
  .racer-list-row input[type=checkbox]{ width:22px; height:22px; margin:0; accent-color:var(--pink); flex-shrink:0; }
  #update-banner{ position:fixed; left:50%; bottom:calc(1rem + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:60; width:calc(100% - 2rem); max-width:480px; display:none; align-items:center; justify-content:space-between; gap:0.8rem; background:var(--gold); color:var(--ink); border:2px solid var(--ink); border-radius:16px; box-shadow:var(--shadow-ink); padding:0.7rem 0.8rem 0.7rem 1.1rem; font-weight:700; font-size:0.95rem; }
  #update-banner.show{ display:flex; }
  #update-banner button{ padding:0.55rem 0.9rem; min-height:auto; background:var(--surface); flex-shrink:0; }
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} .blob{animation:none;top:20px;} }
</style>
</head>
<body>
<div id="logo-badge"><img src="logo-mark.png" alt="SevSpell"></div>
<div id="balance-badge"></div>
<div id="app" class="page"></div>
<div id="update-banner" role="status"><span>A new version of SevSpell is ready</span><button type="button" id="btn-update-now">Update now</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const app = document.getElementById('app');

// ---------- Version and update check ----------
// BUMP APP_VERSION WITH EVERY CHANGE TO THIS FILE. The app fetches a fresh copy of itself from
// GitHub (bypassing every cache), reads the APP_VERSION inside it, and if it differs from the
// one running, offers (or, on the sign-in/profile screens, just does) a reload. This matters most
// for the iOS home-screen version, which otherwise keeps running an old cached copy.
const APP_VERSION = '2026-09-30.4';
let latestSeenVersion = null, lastUpdateCheckAt = 0;
function freshUrl(){ return location.origin + location.pathname + '?v=' + Date.now(); }
async function fetchLatestVersion(){
  if(location.protocol==='file:') return null;
  const resp = await fetch(freshUrl(), { cache:'no-store' });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  const text = await resp.text();
  const m = text.match(/const APP_VERSION = '([0-9A-Za-z.\-]+)'/);
  return m ? m[1] : null;
}
function reloadToLatest(){
  try{ sessionStorage.setItem('sevspell_update_tried', latestSeenVersion || 'manual'); }catch(e){}
  // A brand new URL (unique ?v=) sidesteps the cached copy iOS is holding on to.
  location.replace(freshUrl());
}
function showUpdateBanner(){
  const el = document.getElementById('update-banner');
  if(!el) return;
  el.classList.add('show');
  document.getElementById('btn-update-now').onclick = reloadToLatest;
}
async function checkForUpdate(opts){
  const manual = opts && opts.manual;
  if(!manual && Date.now() - lastUpdateCheckAt < 2*60*1000) return 'skipped';
  lastUpdateCheckAt = Date.now();
  let latest;
  try{ latest = await fetchLatestVersion(); }catch(e){ return 'error'; }
  if(!latest) return 'error';
  latestSeenVersion = latest;
  if(latest===APP_VERSION){ try{ sessionStorage.removeItem('sevspell_update_tried'); }catch(e){} return 'current'; }
  if(manual) return 'newer';
  // Only reload by itself where nothing can be lost, and never twice in a row for the same version
  // (GitHub can take a few minutes to publish a push, so the "new" copy may briefly still be the old one).
  let alreadyTried = false;
  try{ alreadyTried = sessionStorage.getItem('sevspell_update_tried')===latest; }catch(e){}
  if(!alreadyTried && (state.view==='login' || state.view==='profiles')) reloadToLatest();
  else showUpdateBanner();
  return 'newer';
}
// Check on launch, and again whenever the home-screen app is brought back to the front
// (iOS often resumes a suspended copy rather than loading the page again).
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkForUpdate(); });
window.addEventListener('pageshow', (e)=>{ if(e.persisted) checkForUpdate(); });

const SEVLING_BODY = 'M60,15 C85,15 100,40 100,65 C100,95 82,110 60,110 C38,110 20,95 20,65 C20,40 35,15 60,15 Z';
const SEVLINGS = [
  { id:'fleece', name:'Fleece', collection:'farm', features:'<circle cx="34" cy="34" r="10"/><circle cx="86" cy="34" r="10"/>' },
  { id:'billy', name:'Billy', collection:'farm', features:'<path d="M40,20 Q24,-10 54,10 Z"/><path d="M80,20 Q96,-10 66,10 Z"/>' },
  { id:'bessie', name:'Bessie', collection:'farm', features:'<ellipse cx="18" cy="38" rx="11" ry="7"/><ellipse cx="102" cy="38" rx="11" ry="7"/>' },
  { id:'daisy', name:'Daisy', collection:'farm', features:'<ellipse cx="16" cy="45" rx="11" ry="7" transform="rotate(20 16 45)"/><ellipse cx="104" cy="45" rx="11" ry="7" transform="rotate(-20 104 45)"/>' },
  { id:'waddle', name:'Waddle', collection:'farm', features:'<path d="M90,72 Q116,62 110,84 Q100,76 98,88 Q110,90 102,102 Q86,96 90,72 Z"/>' },
  { id:'bray', name:'Bray', collection:'farm', features:'<ellipse cx="42" cy="-8" rx="9" ry="26"/><ellipse cx="78" cy="-8" rx="9" ry="26"/>' },
  { id:'henrietta', name:'Henrietta', collection:'farm', features:'<path d="M50,15 L55,1 L60,15 L65,4 L69,15 Z"/><path d="M90,72 Q114,62 100,94 Z"/>' },
  { id:'pepper', name:'Pepper', collection:'farm', features:'<path d="M48,14 L53,2 L58,14 L63,0 L68,14 Z"/><path d="M85,65 Q115,50 108,90 Q98,72 85,78 Z"/>' },
  { id:'slowie', name:'Slowie', collection:'jungle', features:'<path d="M28,30 Q-15,55 22,92 Q10,60 28,30 Z"/><path d="M92,30 Q135,55 98,92 Q110,60 92,30 Z"/>' },

// ---------- Sevling idle animation (blink/happy cycling on unlocked artwork) ----------
// Frame sequence depends on the Sevling's current happiness (game.sevlingCare[id].happiness):
//   >= 60%  -> happy, blink, happy (loops, mostly smiling with an occasional blink)
//   < 60%   -> resting, blink (loops, a plainer idle blink)
const SEVLING_ANIM_HAPPY_SEQUENCE = ['happy','blink','happy'];
const SEVLING_ANIM_NORMAL_SEQUENCE = ['resting','blink'];
const SEVLING_ANIM_DURATIONS = { resting:2500, blink:180, happy:1400 };
let sevlingAnimTimers = [];
function stopSevlingAnimations(){
  sevlingAnimTimers.forEach(id=>clearTimeout(id));
  sevlingAnimTimers = [];
}
function sevlingFrameSrc(s, frame){
  if(frame==='blink') return s.imageBlink;
  if(frame==='happy') return s.imageHappy;
  return s.image;
}
function sevlingAnimSequence(s){
  const happiness = (game.sevlingCare[s.id] && game.sevlingCare[s.id].happiness) || 0;
  return happiness >= 60 ? SEVLING_ANIM_HAPPY_SEQUENCE : SEVLING_ANIM_NORMAL_SEQUENCE;
}
function startSevlingAnimation(img, s){
  let step = 0;
  function tick(){
    if(!document.body.contains(img)) return; // element was replaced by a re-render, stop quietly
    const sequence = sevlingAnimSequence(s); // re-read each tick so a happiness change mid-cycle takes effect promptly
    const frame = sequence[step % sequence.length];
    img.src = sevlingFrameSrc(s, frame);
    step++;
    const nextSequence = sevlingAnimSequence(s);
    const nextFrame = nextSequence[step % nextSequence.length];
    const id = setTimeout(tick, SEVLING_ANIM_DURATIONS[nextFrame] || 2500);
    sevlingAnimTimers.push(id);
  }
  // small random stagger so multiple visible Sevlings don't blink in perfect unison
  const startId = setTimeout(tick, Math.floor(Math.random()*1000));
  sevlingAnimTimers.push(startId);
}

}

let cachedVoices = [];
function loadVoices(){
  return new Promise((resolve)=>{
    const existing = window.speechSynthesis.getVoices();
    if(existing && existing.length){ cachedVoices = existing; resolve(cachedVoices); return; }
    let resolved = false;
    const done = ()=>{
      if(resolved) return;
      resolved = true;
      cachedVoices = window.speechSynthesis.getVoices() || [];
      resolve(cachedVoices);
    };
    window.speechSynthesis.onvoiceschanged = done;
    setTimeout(done, 400);
  });
}
function pickVoice(voices, lang){
  if(!voices || !voices.length) return null;
  const wanted = (lang||'').toLowerCase();
  const prefix = wanted.split('-')[0];
  const exact = voices.filter(v=>v.lang && v.lang.toLowerCase()===wanted);
  const partial = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(prefix+'-'));
  const pool = exact.length ? exact : partial;
  if(!pool.length) return null;
  const local = pool.find(v=>v.localService);
  return local || pool[0];
}
function resolveVoice(voices, lang){
  const prefix = (lang||'').toLowerCase().split('-')[0];
  const pref = settings.voicePrefs && settings.voicePrefs[prefix];
  if(pref){
    const match = voices.find(v=>v.name===pref.name && v.lang===pref.lang);
    if(match) return match;
  }
  return pickVoice(voices, lang);
}
async function speakSequence(items){
  const validItems = (items||[]).filter(it => it && it.text);
  if(!('speechSynthesis' in window) || !validItems.length) return;
  try{
    window.speechSynthesis.cancel();
    const voices = cachedVoices.length ? cachedVoices : await loadVoices();
    await new Promise((resolve)=>{
      let settled = false;
      const finish = ()=>{ if(settled) return; settled = true; resolve(); };
      validItems.forEach((item, i)=>{
        const u = new SpeechSynthesisUtterance(item.text);
        u.lang = item.lang;
        u.rate = 0.9;
        const voice = resolveVoice(voices, item.lang);
        if(voice) u.voice = voice;
        if(i === validItems.length - 1){ u.onend = finish; u.onerror = finish; }
        window.speechSynthesis.speak(u);
      });
      setTimeout(finish, 6000);
    });
  }catch(e){}
}

// ---------- image handling ----------
let heicLibLoaded = false;
function ensureHeicLib(){
  return new Promise((resolve, reject)=>{
    if(heicLibLoaded && window.heic2any){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';
    script.onload = ()=>{ heicLibLoaded = true; resolve(); };
    script.onerror = ()=>reject(new Error('Could not load HEIC support.'));
    document.head.appendChild(script);
  });
}
function loadImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file from your device.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1200;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({ b64: dataUrl.split(',')[1], preview: dataUrl });
      };
      img.onerror = ()=>reject(new Error('The browser could not decode that image format.'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function resizeImageToBase64(file){
  try{ return await loadImageFile(file); }
  catch(e){
    try{
      await ensureHeicLib();
      const converted = await window.heic2any({ blob:file, toType:'image/jpeg', quality:0.85 });
      const jpegFile = Array.isArray(converted) ? converted[0] : converted;
      return await loadImageFile(jpegFile);
    }catch(e2){
      throw new Error((e2 && e2.message) ? e2.message : (e && e.message) || 'unknown error');
    }
  }
}
async function extractWords(b64, lang){
  if(!settings.geminiKey) throw new Error('Add a Gemini API key in Settings first.');
  const promptText = lang==='en' ? EXTRACT_PROMPT_EN : EXTRACT_PROMPT_ES;
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/interactions?key=${encodeURIComponent(settings.geminiKey)}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      model:'gemini-3.6-flash',
      input:[
        { type:'text', text: promptText },
        { type:'image', data:b64, mime_type:'image/jpeg' }
      ],
      response_format:{ type:'text', mime_type:'application/json' }
    })
  });
  const data = await resp.json();
  if(data.error) throw new Error(data.error.message || 'Gemini API error');
  const modelStep = Array.isArray(data.steps) ? data.steps.find(s=>s.type==='model_output') : null;
  const textPart = modelStep && Array.isArray(modelStep.content) ? modelStep.content.find(c=>c.type==='text') : null;
  let raw = textPart ? textPart.text : '';
  raw = (raw||'').replace(/```json|```/g,'').trim();
  if(!raw) throw new Error('No text in the response, the photo may be unclear.');
  const parsed = JSON.parse(raw);
  if(!Array.isArray(parsed)) throw new Error('Unexpected response.');
  if(lang==='en') return parsed.map(w=>({ spanish:'', english:cleanExtractedWord(w.english) })).filter(w=>w.english);
  return parsed.map(w=>({ spanish:cleanExtractedWord(w.spanish), english:cleanExtractedWord(w.english) })).filter(w=>w.spanish||w.english);
}
function cleanExtractedWord(s){
  return (s||'')
    .trim()
    .replace(/^[\(\[]?\d+[\)\].:]?\s*/, '')
    .replace(/^[\u00bf\u00a1]+\s*/, '')
    .replace(/\s*[\u00bf\u00a1]+$/, '')
    .trim();
}

        if(existing.exists()) throw { message:'That username is already taken.' };
        const inviteSnap = await getDoc(doc(db,'family','invite'));
        const isFirstEver = !inviteSnap.exists() || !inviteSnap.data().code;
        if(!isFirstEver){
          const realCode = inviteSnap.data().code;
          if(!inviteInput || inviteInput.toUpperCase() !== String(realCode).toUpperCase()){
            throw { message: 'That invite code doesn\u2019t match. Check with whoever set this up.' };
          }
        }
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        authUser = cred.user;
        await updateProfile(cred.user, { displayName: username });
        await setDoc(doc(db,'usernames', usernameKey), { email, uid: cred.user.uid });

      }catch(e){ state.error = friendlyAuthError(e); }
      render();
    };
  }
}

async function importLegacyAccount(oldUsername, oldPassword, newProfileId){
  const usernameKey = oldUsername.toLowerCase();
  const mapDoc = await getDoc(doc(db,'usernames', usernameKey));
  if(!mapDoc.exists()) throw new Error('No account found with that username.');
  const oldEmail = mapDoc.data().email;

  const secondaryApp = initializeApp(settings.firebaseConfig, 'legacy-import-' + Date.now());
  const secondaryAuth = getAuth(secondaryApp);
  const secondaryDb = getFirestore(secondaryApp);
  let oldUid;
  try{
    const cred = await signInWithEmailAndPassword(secondaryAuth, oldEmail, oldPassword);
    oldUid = cred.user.uid;
  }catch(e){
    throw new Error('Could not sign in to that old account, check the username and password.');
  }

  async function readOld(kind, id){
    const snap = await getDoc(doc(secondaryDb,'spelling_users', oldUid, kind, id));
    return snap.exists() ? snap.data() : null;
  }
  const oldIndexDoc = await readOld('data','index');
  const oldGameDoc = await readOld('data','game');
  const oldPrefsDoc = await readOld('data','prefs');
  const oldLists = (oldIndexDoc && oldIndexDoc.lists) ? oldIndexDoc.lists : [];

  if(oldIndexDoc) await setDoc(doc(db,'spelling_users', authUser.uid, 'profiles', newProfileId, 'data','index'), oldIndexDoc);
  if(oldGameDoc) await setDoc(doc(db,'spelling_users', authUser.uid, 'profiles', newProfileId, 'data','game'), oldGameDoc);
  if(oldPrefsDoc) await setDoc(doc(db,'spelling_users', authUser.uid, 'profiles', newProfileId, 'data','prefs'), oldPrefsDoc);
  for(const l of oldLists){
    const listDoc = await getDoc(doc(secondaryDb,'spelling_users', oldUid, 'lists', l.id));
    if(listDoc.exists()){
      await setDoc(doc(db,'spelling_users', authUser.uid, 'profiles', newProfileId, 'lists', l.id), listDoc.data());
    }
  }
  try{ await signOut(secondaryAuth); }catch(e){}
  return { listsCount: oldLists.length, hadGame: !!oldGameDoc };
}

const PRACTICE_MODES = {

let copyRevealTimer = null;
function clearCopyRevealTimer(){ if(copyRevealTimer){ clearTimeout(copyRevealTimer); copyRevealTimer = null; } }

function renderPractice(){
  const p = state.practice;
  const word = p.words[p.index];
  const info = modeInfo(p.mode);
  const shownWord = word[info.shownField];
  const shownLang = info.shownField==='spanish' ? 'es-ES' : 'en-GB';
  const speakFirst = p.mode==='copy' ? { text: word.english, lang: 'en-GB' } : null;
  const wordVisible = !info.revealTimer || (p.wordRevealed && !p.wordHidden);
  app.innerHTML = `
    <div class="progress">Word ${p.index+1} of ${p.words.length} &nbsp;\u00B7&nbsp; Score ${p.score}</div>
    <div class="card">
      <div class="word-row">
        <div class="practice-word${wordVisible ? '' : ' word-faded'}" id="practice-shown-word">${wordVisible ? escapeHtml(shownWord) : ''}</div>
        ${speakBtn(shownWord, shownLang, speakFirst)}
      </div>
      ${info.showTranslation ? `<div class="practice-translation">${escapeHtml(word.english)}</div>` : ''}
      <input type="text" id="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="${info.placeholder}" ${p.checked ? 'disabled' : ''} value="${escapeHtml(p.input)}">
      ${p.checked ? feedbackHtml(p, word) : ''}
    </div>
    <div class="btn-row">
      ${p.checked
        ? `<button class="btn-primary" id="btn-next">${p.index+1 < p.words.length ? 'Next word' : 'See results'}</button>`
        : `<button class="btn-primary" id="btn-check">Check</button>`}
      <button class="btn-ghost" id="btn-quit">Stop practising</button>
    </div>
  `;
  const input = document.getElementById('answer-input');
  input.focus();
  input.oninput = (e)=>{ p.input = e.target.value; };
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); if(p.checked) nextWord(); else checkAnswer(word); } };
  if(!p.checked){ document.getElementById('btn-check').onclick = ()=>checkAnswer(word); }
  else{ document.getElementById('btn-next').onclick = ()=>nextWord(); }
  document.getElementById('btn-quit').onclick = ()=>{ if(confirm('Stop this practice session?')){ clearCopyRevealTimer(); if('speechSynthesis' in window) window.speechSynthesis.cancel(); state.view='home'; render(); } };
  clearCopyRevealTimer();
  if(info.revealTimer && !p.checked && !p.wordRevealed && !p.wordHidden){
    const listMeta = state.lists.find(l=>l.id===p.listId);
    const visibleMs = (listMeta && listMeta.mastered) ? 3000 : 4000;
    speakSequence(info.audio(word)).then(()=>{
      if(!(state.practice===p && !p.checked && !p.wordRevealed)) return;
      p.wordRevealed = true;
      const el = document.getElementById('practice-shown-word');
      if(el){ el.textContent = shownWord; el.classList.remove('word-faded'); }
      copyRevealTimer = setTimeout(()=>{
        copyRevealTimer = null;
        const el2 = document.getElementById('practice-shown-word');
        if(el2) el2.classList.add('word-faded');
        setTimeout(()=>{
          if(state.practice===p && !p.checked){
            p.wordHidden = true;
            const el3 = document.getElementById('practice-shown-word');
            if(el3) el3.textContent = '';
          }
        }, 450);
      }, visibleMs);
    });
  }
}
function accentSpanHtml(word){
  return escapeHtml(word).replace(/([\u00e1\u00e9\u00ed\u00f3\u00fa\u00fc\u00c1\u00c9\u00cd\u00d3\u00da\u00dc])/g, '<span class="accent-letter">$1</span>');
}
function feedbackHtml(p, word){
  const info = modeInfo(p.mode);
  const targetText = word[info.gradeField];
  const targetLang = info.gradeField==='spanish' ? 'es-ES' : 'en-GB';
  if(p.lastCorrect){
    if(p.accentMissing) return `<div class="feedback ok accent-note">Correct!<div class="answer-note">Don't forget the accent next time</div><div class="answer-word">${accentSpanHtml(targetText)} ${speakBtn(targetText,targetLang)}</div></div>`;
    return `<div class="feedback ok">Correct!</div>`;
  }
  return `<div class="feedback no">Not quite<span class="answer">Correct spelling: ${escapeHtml(targetText)} ${speakBtn(targetText,targetLang)}</span></div>`;
}
// Shared grading used by practice mode and the Overhead Racer pit-stop spellings:
// capitalisation and punctuation ignored, a missing accent still counts (flagged), ñ is not an accent.
function gradeSpelling(inputText, targetText){
  const target = normaliseBase(targetText);
  const input = normaliseBase(inputText);
  const exact = input === target;
  const matchesIgnoringAccents = stripAccents(input) === stripAccents(target);
  const correct = exact || matchesIgnoringAccents;
  return { correct, accentMissing: correct && !exact };
}
function checkAnswer(word){
  const p = state.practice;
  const info = modeInfo(p.mode);
  const result = gradeSpelling(p.input, word[info.gradeField]);
  p.checked = true;
  p.lastCorrect = result.correct;
  p.accentMissing = result.accentMissing;
  if(p.lastCorrect) p.score++; else p.wrong.push(word);
  render();
}
function computeReward(wrongCount){
  if(wrongCount===0) return { type:'trophy', value:5 };
  if(wrongCount===1) return { type:'gold', value:3 };
  if(wrongCount===2) return { type:'silver', value:2 };
  if(wrongCount>=3 && wrongCount<=4) return { type:'bronze', value:1 };
  return null;
}
function randomTrophyVariant(){
  return { adj: TROPHY_ADJ[Math.floor(Math.random()*TROPHY_ADJ.length)], hue: Math.floor(Math.random()*360), emoji: Math.random()<0.5 ? '\uD83C\uDFC6' : '\uD83C\uDFC5' };
}
async function nextWord(){
  const p = state.practice;
  if(p.index+1 < p.words.length){
    p.index++; p.checked = false; p.lastCorrect = false; p.accentMissing = false; p.input = ''; p.wordHidden = false; p.wordRevealed = false; render(); return;
  }
  if(!p.isRetry){
    const reward = computeReward(p.wrong.length);
    p.reward = reward;
    if(reward){
      game.totalEarned += reward.value; game.balance += reward.value; game.medals[reward.type]++;
      p.trophyVariant = reward.type==='trophy' ? randomTrophyVariant() : null;
    }
    const pct = Math.round((p.score / p.words.length) * 100);
    p.pct = pct;
    await checkSevlingUnlock(p);
    checkArcadeUnlock(p, pct);
    await saveGame();
    if(p.wrong.length===0 && p.listId){
      const listMeta = state.lists.find(l=>l.id===p.listId);
      if(listMeta && !listMeta.mastered){
        listMeta.mastered = true;
        await saveIndex(state.lists);
      }
    }
  }else{ p.reward = null; }
  state.view = 'results'; render();
}
function checkArcadeUnlock(p, pct){
  if(!p.listId) return;
  if(!game.gameUnlockStreaks) game.gameUnlockStreaks = {};
  if(pct >= 90){
    game.gameUnlockStreaks[p.listId] = (game.gameUnlockStreaks[p.listId]||0) + 1;
    if(game.gameUnlockStreaks[p.listId] >= 3){
      game.arcadeMs = (game.arcadeMs||0) + 5*60*1000;
      game.gameUnlockStreaks[p.listId] = 0;
      p.arcadeUnlocked = true;
    }
  }
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
async function checkSevlingUnlock(p){
  if(!p.listId) return;
  if(!game.listStreaks) game.listStreaks = {};
  if(p.wrong.length===0){
    game.listStreaks[p.listId] = (game.listStreaks[p.listId]||0) + 1;
    // Every perfect practice, on any list, chips a day off the cooldown wait below (floor 7 days/1 week).
    game.fullMarksSinceLastWin = (game.fullMarksSinceLastWin||0) + 1;
  }
  const effectiveCooldownDays = Math.max(7, (game.cooldownDays||14) - (game.fullMarksSinceLastWin||0));
  const cooldownMs = effectiveCooldownDays * 24*60*60*1000;
  const cooldownReady = !game.lastSevlingAt || (Date.now() - game.lastSevlingAt) >= cooldownMs;
  const streakReady = (game.listStreaks[p.listId]||0) >= (game.streakGoal||4);
  if(streakReady && cooldownReady){
    const locked = SEVLINGS.filter(s=>!game.unlockedSevlings.includes(s.id));
    if(locked.length){
      const won = locked[Math.floor(Math.random()*locked.length)];
      game.unlockedSevlings.push(won.id);
      game.sevlingCare[won.id] = { happiness:50, accessories:[] };
      game.listStreaks = {};
      game.streakGoal = randInt(4,5);
      game.lastSevlingAt = Date.now();
      game.cooldownDays = randInt(14,21);
      game.fullMarksSinceLastWin = 0;
      p.newSevling = won;
    }
  }
}
function collectionLabel(id){ return ({ farm:'Farm', jungle:'Jungle', sea:'Sea', pets:'Pets' })[id] || id; }
function sevlingsProgressLine(listId, listLabel){
  const streaks = game.listStreaks || {};
  const remaining = Math.max(0, (game.streakGoal||4) - (streaks[listId]||0));
  const effectiveCooldownDays = Math.max(7, (game.cooldownDays||14) - (game.fullMarksSinceLastWin||0));
  const cooldownMs = effectiveCooldownDays * 24*60*60*1000;
  const daysLeft = game.lastSevlingAt ? Math.max(0, Math.ceil((cooldownMs - (Date.now()-game.lastSevlingAt)) / 86400000)) : 0;
  const label = listLabel ? `"${listLabel}"` : 'this list';
  if(remaining<=0 && daysLeft<=0) return `Get every word right on your next practice with ${label} to win a new Sevling!`;
  const parts = [];
  if(remaining>0) parts.push(`${remaining} more perfect test${remaining===1?'':'s'} with ${label}`);
  if(daysLeft>0) parts.push(`${daysLeft} more day${daysLeft===1?'':'s'}`);
  let line = `${parts.join(' and ')} until your next Sevling.`;
  // The day count already includes the perfect-score speed-up, spell that out so it's clear
  // perfect scores are what shorten it, and how short it can get (the 7-day floor).
  if(daysLeft>0){
    const elapsedMs = Date.now() - game.lastSevlingAt;
    const floorDaysLeft = Math.max(0, Math.ceil((7*86400000 - elapsedMs) / 86400000));
    if(effectiveCooldownDays > 7){
      const shortest = floorDaysLeft===0 ? 'enough of them could make it ready straight away' : `it can come down to just ${floorDaysLeft} day${floorDaysLeft===1?'':'s'}`;
      line += ` Every perfect score, on any list, takes a day off the wait, ${shortest}.`;
    }else{
      line += ' Perfect scores have already brought the wait down to the shortest it can be.';
    }
  }
  return line;
}

// ---- Connect 4 ----
function newConnect4(){ return { board: Array.from({length:7}, ()=>[]), turn:1, over:false, winner:null, winCells:[], wonItemName:null }; }
function c4ValidCols(board){ const out=[]; for(let c=0;c<7;c++) if(board[c].length<6) out.push(c); return out; }
function c4DropRow(board,col){ return board[col].length; }
function c4CheckWin(board,col,row,player){
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for(const [dx,dy] of dirs){
    let cells = [[col,row]];
    let c=col+dx, r=row+dy;
    while(c>=0&&c<7&&r>=0&&r<6&&board[c][r]===player){ cells.push([c,r]); c+=dx; r+=dy; }
    c=col-dx; r=row-dy;
    while(c>=0&&c<7&&r>=0&&r<6&&board[c][r]===player){ cells.push([c,r]); c-=dx; r-=dy; }
    if(cells.length>=4) return cells;
  }
  return null;
}
function c4WouldWin(board,col,player){
  if(board[col].length>=6) return false;
  const row = c4DropRow(board,col);
  board[col].push(player);
  const win = c4CheckWin(board,col,row,player);
  board[col].pop();
  return !!win;
}
function c4AiMove(board){
  const valid = c4ValidCols(board);
  for(const c of valid) if(c4WouldWin(board,c,2)) return c;
  for(const c of valid) if(c4WouldWin(board,c,1)) return c;
  const weights = valid.map(c=>4-Math.abs(c-3));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<valid.length;i++){ r-=weights[i]; if(r<=0) return valid[i]; }
  return valid[valid.length-1];
}
function renderConnect4(){
  if(!state.c4) state.c4 = newConnect4();
  const c4 = state.c4;
  const oppId = game.selectedConnect4Sevling;
  const oppSevling = oppId ? SEVLINGS.find(s=>s.id===oppId) : null;
  const hasTime = (game.arcadeMs||0) > 0;
  let statusText;
  if(c4.over) statusText = c4.winner===1 ? 'You win! \uD83C\uDF89' : (c4.winner===2 ? 'The Sevling wins!' : "It's a draw!");
  else statusText = c4.turn===1 ? 'Your turn' : 'Thinking\u2026';
  let boardHtml = '';
  for(let rowFromTop=0; rowFromTop<6; rowFromTop++){
    const row = 5-rowFromTop;
    for(let col=0; col<7; col++){
      const val = c4.board[col][row];
      const isWin = c4.winCells.some(([cc,rr])=>cc===col&&rr===row);

  document.getElementById('btn-c4-restart').onclick = ()=>{ if((game.arcadeMs||0)<=0) return; state.c4 = newConnect4(); render(); };

function c4PlayerMove(col){
  const c4 = state.c4;
  if(!c4 || c4.over || c4.turn!==1 || c4.board[col].length>=6) return;
  const row = c4DropRow(c4.board,col);
  c4.board[col].push(1);
  const win = c4CheckWin(c4.board,col,row,1);
  if(win){
    c4.over=true; c4.winner=1; c4.winCells=win;
    const sevlingId = game.selectedConnect4Sevling;
    if(sevlingId) awardSevlingItem(sevlingId).then(itemName=>{ c4.wonItemName = itemName; render(); });
    render(); return;
  }
  if(c4ValidCols(c4.board).length===0){ c4.over=true; c4.winner='draw'; render(); return; }
  c4.turn = 2;
  render();
  setTimeout(()=>{
    if(!state.c4 || state.c4!==c4 || c4.over) return;
    const aiCol = c4AiMove(c4.board);
    const aiRow = c4DropRow(c4.board,aiCol);
    c4.board[aiCol].push(2);
    const aiWin = c4CheckWin(c4.board,aiCol,aiRow,2);
    if(aiWin){ c4.over=true; c4.winner=2; c4.winCells=aiWin; }
    else if(c4ValidCols(c4.board).length===0){ c4.over=true; c4.winner='draw'; }
    else c4.turn=1;
    render();
  }, 500);
}

// ---- Snake ----
function newSnake(){
  return { size:12, snake:[{x:6,y:6},{x:5,y:6},{x:4,y:6}], dir:{x:1,y:0}, nextDir:{x:1,y:0}, food:{x:9,y:6}, score:0, over:false, rewardGiven:false, wonItemName:null };
}
function snakeRandomFood(s){
  let pos;
  do{ pos = { x:Math.floor(Math.random()*s.size), y:Math.floor(Math.random()*s.size) }; }
  while(s.snake.some(seg=>seg.x===pos.x&&seg.y===pos.y));
  return pos;
}
function snakeTick(s){
  if(s.over) return;
  s.dir = s.nextDir;
  const head = { x: s.snake[0].x + s.dir.x, y: s.snake[0].y + s.dir.y };
  if(head.x<0||head.x>=s.size||head.y<0||head.y>=s.size || s.snake.some(seg=>seg.x===head.x&&seg.y===head.y)){
    s.over = true; return;
  }
  s.snake.unshift(head);
  if(head.x===s.food.x && head.y===s.food.y){ s.score++; s.food = snakeRandomFood(s); }
  else s.snake.pop();
}
function snakeSetDir(s,dx,dy){
  if(!s || s.over) return;
  if(s.dir.x===-dx && s.dir.y===-dy) return;
  s.nextDir = {x:dx,y:dy};
}
function startSnakeLoop(){
  if(snakeLoopInterval) return;
  snakeLoopInterval = setInterval(()=>{
    const s = state.snake;
    if(!s || s.over){
      clearInterval(snakeLoopInterval); snakeLoopInterval = null;
      render();
      return;
    }
    snakeTick(s);
    if(s.score>=10 && !s.rewardGiven){

// ---- Maze Munch ----
// An original maze-chase game (dots, a maze, chasing enemies), not a reproduction of any
// licensed character art, generic shapes and colours throughout by design.
const MAZE_TEMPLATE = [
  "###############",
  "#.............#",
  "#.##.#####.##.#",
  "#.............#",
  "#.##.#.#.#.##.#",
  "#.............#",
  "#.##.#.#.#.##.#",
  "#.............#",
  "#.##.#####.##.#",
  "#.............#",
  "###############"
];
const MAZE_COLS = MAZE_TEMPLATE[0].length;
const MAZE_ROWS = MAZE_TEMPLATE.length;
function mazeCellAt(grid,x,y){ if(y<0||y>=MAZE_ROWS||x<0||x>=MAZE_COLS) return 0; return grid[y][x]; }
function mazeCanMove(grid,x,y){ return mazeCellAt(grid,x,y)!==0; }
function newMaze(){
  const grid = MAZE_TEMPLATE.map(row=>row.split('').map(ch=>ch==='#'?0:1));
  grid[5][7] = 2;
  const dotsLeft = grid.reduce((sum,row)=>sum+row.filter(c=>c===1).length,0);
  return {
    grid, player:{x:7,y:5}, dir:{x:0,y:0}, nextDir:{x:0,y:0},
    ghosts: [
      { x:1, y:1, color:'var(--wrong)', dir:{x:1,y:0} },
      { x:13, y:1, color:'var(--blue)', dir:{x:-1,y:0} },
      { x:1, y:9, color:'var(--gold)', dir:{x:1,y:0} }
    ],
    dotsLeft, score:0, over:false, won:false, tick:0, startedAt: Date.now(), rewardGiven:false, wonItemName:null
  };
}
function mazeSetDir(m,dx,dy){ if(!m || m.over) return; m.nextDir = {x:dx,y:dy}; }
function mazeTick(m){
  if(m.over) return;
  m.tick++;
  if(mazeCanMove(m.grid, m.player.x+m.nextDir.x, m.player.y+m.nextDir.y)) m.dir = m.nextDir;
  const px = m.player.x+m.dir.x, py = m.player.y+m.dir.y;
  if(mazeCanMove(m.grid,px,py)){ m.player.x = px; m.player.y = py; }
  if(m.grid[m.player.y][m.player.x]===1){
    m.grid[m.player.y][m.player.x] = 2; m.score++; m.dotsLeft--;
    if(m.dotsLeft<=0){ m.won = true; m.over = true; return; }
  }
  if(m.ghosts.some(g=>g.x===m.player.x && g.y===m.player.y)){ m.over = true; m.won = false; return; }
  if(m.tick % 3 === 0){
    const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    m.ghosts.forEach(g=>{
      let candidates = dirs.filter(d=> mazeCanMove(m.grid,g.x+d.x,g.y+d.y) && !(d.x===-g.dir.x && d.y===-g.dir.y));
      if(!candidates.length) candidates = dirs.filter(d=>mazeCanMove(m.grid,g.x+d.x,g.y+d.y));
      if(!candidates.length) return;
      let choice;
      if(Math.random()<0.2){
        choice = candidates[Math.floor(Math.random()*candidates.length)];
      }else{
        choice = candidates.reduce((best,d)=>{
          const nx=g.x+d.x, ny=g.y+d.y;
          const dist = (nx-m.player.x)**2 + (ny-m.player.y)**2;
          return (!best || dist<best.dist) ? {d,dist} : best;
        }, null).d;
      }
      g.dir = choice; g.x += choice.x; g.y += choice.y;
    });
    if(m.ghosts.some(g=>g.x===m.player.x && g.y===m.player.y)){ m.over = true; m.won = false; }
  }
}
function startMazeLoop(){
  if(mazeLoopInterval) return;
  mazeLoopInterval = setInterval(()=>{
    const m = state.maze;
    if(!m || m.over){ clearInterval(mazeLoopInterval); mazeLoopInterval = null; render(); return; }
    mazeTick(m);
    if(!m.over && !m.rewardGiven && (Date.now()-m.startedAt)>=10000){
      m.rewardGiven = true;
      const sevlingId = game.selectedMazeSevling;
      if(sevlingId) awardSevlingItem(sevlingId).then(itemName=>{ m.wonItemName = itemName; render(); });
    }
    render();
  }, 200);
}

// ---- Shared canvas-game helpers (Brick Breaker, Overhead Racer) ----
// These two games draw to a <canvas> on a requestAnimationFrame loop rather than rebuilding
// the DOM every tick. The loop looks its canvas up by id on every frame, so a render() of the
// same view (e.g. when the arcade countdown expires) simply swaps in a fresh canvas and the
// loop carries on drawing into it.
let arcadeRafId = null;
function startArcadeRaf(step){
  if(arcadeRafId) return;
  let last = performance.now();
  const frame = (now)=>{
    const dt = Math.min(0.05, Math.max(0, (now-last)/1000)); last = now;
    const keepGoing = step(dt);
    arcadeRafId = keepGoing===false ? null : requestAnimationFrame(frame);
  };
  arcadeRafId = requestAnimationFrame(frame);
}
function pauseArcadeCountdown(){ if(arcadeTickInterval){ clearInterval(arcadeTickInterval); arcadeTickInterval = null; } }
function prepCanvas(id, w, h){
  const c = document.getElementById(id);
  if(!c) return null;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  if(c.dataset.ready!=='1'){
    c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
    c.dataset.ready = '1';
  }
  const ctx = c.getContext('2d');
  return { c, ctx, dpr };
}
function rrPath(ctx, x, y, w, h, r){
  const rad = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rad, y);
  ctx.arcTo(x+w, y, x+w, y+h, rad);
  ctx.arcTo(x+w, y+h, x, y+h, rad);
  ctx.arcTo(x, y+h, x, y, rad);
  ctx.arcTo(x, y, x+w, y, rad);
  ctx.closePath();
}
// A "sticker" shape in the Foil style: hard ink offset shadow, colour fill, 2px ink outline.
function stickerRect(ctx, x, y, w, h, r, fill, shadow){
  const off = shadow==null ? 3 : shadow;
  if(off){ ctx.fillStyle = FOIL.ink; rrPath(ctx, x+off, y+off, w, h, r); ctx.fill(); }
  ctx.fillStyle = fill; rrPath(ctx, x, y, w, h, r); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = FOIL.ink; ctx.stroke();
}
function holoGradient(ctx, x0, y0, x1, y1){
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, FOIL.pink); g.addColorStop(0.35, FOIL.blue); g.addColorStop(0.7, FOIL.gold); g.addColorStop(1, FOIL.lime);
  return g;
}
const FOIL = { bg:'#F7F5FF', ink:'#221A3D', inkSoft:'#6B6289', pink:'#FF3EA5', blue:'#00C2FF', gold:'#FFD447', lime:'#C4FF3D', white:'#FFFFFF' };
const GAME_EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function setTextIfChanged(id, text){ const el = document.getElementById(id); if(el && el.textContent!==text) el.textContent = text; }
function sevlingSelectOptions(won, selectedId, classicLabel){
  return won.length
    ? `<option value="">${classicLabel}</option>` + won.map(s=>`<option value="${s.id}" ${selectedId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')
    : `<option value="">No Sevlings to select yet</option>`;
}
function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'; }

// Keyboard support for the two canvas games (touch controls are the main input, this is
// a bonus for laptops). Ignored whenever a text box has focus, so typing a spelling works.
const heldKeys = {};
window.addEventListener('keydown', (e)=>{
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
  if(state.view!=='arcade-brick' && state.view!=='arcade-racer') return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)){
    e.preventDefault();
    heldKeys[e.key] = true;
    if(e.key===' ' && state.view==='arcade-brick') bbLaunch();
  }
});
window.addEventListener('keyup', (e)=>{ heldKeys[e.key] = false; });
window.addEventListener('blur', ()=>{ Object.keys(heldKeys).forEach(k=>heldKeys[k]=false); });

// ---- Brick Breaker ----
// Logical board is 480 x 560, scaled to fit the card by CSS. Ball speed deliberately starts
// gentle and ramps only slightly per level, with 5 lives, so it stays winnable for younger players.
const BB_W = 480, BB_H = 560;
const BB_COLS = 8, BB_MARGIN = 16, BB_GAP = 6, BB_BRICK_H = 22, BB_TOP = 52;
const BB_BRICK_W = (BB_W - BB_MARGIN*2 - BB_GAP*(BB_COLS-1)) / BB_COLS;
const BB_BASE_SPEED = 240;
const BB_PADDLE_W = 100;
const BB_LIVES = 5;
const BB_REWARD_BRICKS = 25;
const BB_POWERS = {
  wide:   { emoji:'\u2194\uFE0F', label:'Wide paddle!', colour:FOIL.blue, secs:12 },
  multi:  { emoji:'\u2728', label:'Multi-ball!', colour:FOIL.gold, secs:0 },
  sticky: { emoji:'\uD83C\uDF6F', label:'Sticky paddle! Tap to let go', colour:FOIL.lime, secs:15 },
  laser:  { emoji:'\u26A1', label:'Lasers!', colour:FOIL.pink, secs:10 }
};
const BB_ROW_COLOURS = [FOIL.pink, FOIL.blue, FOIL.gold, FOIL.lime, FOIL.pink, FOIL.blue];
function bbLevelLayout(level){
  const bricks = [];
  const add = (col,row,hp)=>bricks.push({ x: BB_MARGIN + col*(BB_BRICK_W+BB_GAP), y: BB_TOP + row*(BB_BRICK_H+BB_GAP), w: BB_BRICK_W, h: BB_BRICK_H, hp, maxHp:hp, colour: BB_ROW_COLOURS[row%BB_ROW_COLOURS.length], power:null, alive:true });
  const pattern = (level-1) % 3;
  if(pattern===0){
    const rows = level===1 ? 5 : 6;
    for(let r=0;r<rows;r++) for(let c=0;c<BB_COLS;c++) add(c, r, (level>1 && r<2) ? 2 : 1);
  }else if(pattern===1){
    for(let r=0;r<6;r++) for(let c=0;c<BB_COLS;c++) if((r+c)%2===0 || r===0) add(c, r, r===0 ? 2 : 1);
  }else{
    for(let r=0;r<6;r++){
      const inset = Math.abs(r-2.5) < 1 ? 0 : (Math.abs(r-2.5) < 2 ? 1 : 2);
      for(let c=inset;c<BB_COLS-inset;c++) add(c, r, (r===2||r===3) ? 2 : 1);
    }
  }
  // Scatter power-up bricks, making sure every power type appears at least once per wall.
  const kinds = shuffle(['wide','multi','sticky','laser','wide','multi','laser','sticky']);
  const picks = shuffle(bricks.map((_,i)=>i)).slice(0, Math.min(kinds.length, Math.round(bricks.length/6)));
  picks.forEach((bi,k)=>{ bricks[bi].power = kinds[k % kinds.length]; });
  return bricks;
}
function bbNewBall(bb){ return { x: bb.paddle.x, y: bb.paddle.y - 9, vx:0, vy:0, r:8, stuck:true, offset:0 }; }
function newBrickBreaker(){
  const bb = {
    level:1, lives:BB_LIVES, score:0, bricksBroken:0, time:0,
    paddle:{ x:BB_W/2, y:BB_H-42, h:14, w:BB_PADDLE_W },
    balls:[], drops:[], bolts:[], bricks:bbLevelLayout(1),
    wideUntil:0, stickyUntil:0, laserUntil:0, laserCooldown:0,
    pointerX:null, banner:'Tap or press space to launch', bannerUntil:0,
    levelClearT:0, over:false, rewardGiven:false, wonItemName:null
  };
  bb.balls.push(bbNewBall(bb));
  return bb;
}
function bbSpeed(bb){ return BB_BASE_SPEED * Math.min(1.35, 1 + 0.06*(bb.level-1)); }
function bbLaunch(){
  const bb = state.brick;
  if(!bb || bb.over || bb.levelClearT>0) return;
  const sp = bbSpeed(bb);
  bb.balls.forEach(b=>{
    if(!b.stuck) return;
    const rel = Math.max(-1, Math.min(1, b.offset/(bb.paddle.w/2)));
    const ang = rel*0.5 + (Math.random()-0.5)*0.3;
    b.vx = Math.sin(ang)*sp; b.vy = -Math.cos(ang)*sp; b.stuck = false;
  });
}
function bbFixAngle(b, sp){
  // Keep the ball from ever settling into a near-horizontal bounce that never comes back down.
  const minVy = sp*0.32;
  if(Math.abs(b.vy) < minVy){
    b.vy = (b.vy<0?-1:1)*minVy;
    b.vx = (b.vx<0?-1:1)*Math.sqrt(Math.max(0, sp*sp - minVy*minVy));
  }
  // ...and from bouncing perfectly straight up and down the same column forever.
  const minVx = sp*0.12;
  if(Math.abs(b.vx) < minVx) b.vx = (b.vx<0 ? -1 : (b.vx>0 ? 1 : (Math.random()<0.5?-1:1)))*minVx;
  const cur = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx/cur*sp; b.vy = b.vy/cur*sp;
}
function bbHitBrick(bb, brick){
  brick.hp--;
  bb.score += 5;
  if(brick.hp<=0){
    brick.alive = false;
    bb.score += 5;
    bb.bricksBroken++;
    if(brick.power) bb.drops.push({ x: brick.x+brick.w/2, y: brick.y+brick.h/2, kind: brick.power });
    if(bb.bricksBroken>=BB_REWARD_BRICKS && !bb.rewardGiven){
      bb.rewardGiven = true;
      const sevlingId = game.selectedBrickSevling;
      if(sevlingId) awardSevlingItem(sevlingId).then(itemName=>{ bb.wonItemName = itemName; if(state.view==='arcade-brick') render(); });
    }
  }
}
function bbActivate(bb, kind){
  const p = BB_POWERS[kind];
  bb.banner = p.label; bb.bannerUntil = bb.time + 2;
  if(kind==='wide') bb.wideUntil = bb.time + p.secs;
  else if(kind==='sticky') bb.stickyUntil = bb.time + p.secs;
  else if(kind==='laser'){ bb.laserUntil = bb.time + p.secs; bb.laserCooldown = 0; }
  else if(kind==='multi'){
    if(bb.balls.every(b=>b.stuck)) bbLaunch();
    const sp = bbSpeed(bb);
    const extra = [];
    bb.balls.forEach(b=>{
      if(b.stuck) return;
      const base = Math.atan2(b.vx, -b.vy);
      [-0.45, 0.45].forEach(d=>{ const a = base+d; extra.push({ x:b.x, y:b.y, r:b.r, stuck:false, offset:0, vx:Math.sin(a)*sp, vy:-Math.cos(a)*sp }); });
    });
    bb.balls = bb.balls.concat(extra).slice(0, 9);
    bb.balls.forEach(b=>{ if(!b.stuck) bbFixAngle(b, sp); });
  }
}
function bbStep(bb, dt){
  bb.time += dt;
  const pad = bb.paddle;
  pad.w = BB_PADDLE_W * (bb.time < bb.wideUntil ? 1.6 : 1);
  // Paddle movement: follow the finger/mouse directly, or slide with the arrow keys.
  const keyDir = (heldKeys['ArrowRight']?1:0) - (heldKeys['ArrowLeft']?1:0);
  if(keyDir){ bb.pointerX = null; pad.x += keyDir*520*dt; }
  else if(bb.pointerX!=null){ pad.x += (bb.pointerX - pad.x) * Math.min(1, dt*18); }
  pad.x = Math.max(pad.w/2, Math.min(BB_W - pad.w/2, pad.x));

  if(bb.levelClearT>0){
    bb.levelClearT -= dt;
    if(bb.levelClearT<=0){
      bb.level++;
      bb.bricks = bbLevelLayout(bb.level);
      bb.balls = [bbNewBall(bb)]; bb.drops = []; bb.bolts = [];
      bb.banner = `Level ${bb.level}! Tap to launch`; bb.bannerUntil = bb.time + 2.5;
    }
    return;
  }

  // Lasers fire automatically from both ends of the paddle while the power lasts.
  if(bb.time < bb.laserUntil){
    bb.laserCooldown -= dt;
    if(bb.laserCooldown<=0){
      bb.laserCooldown = 0.35;
      bb.bolts.push({ x: pad.x - pad.w/2 + 7, y: pad.y - 4 }, { x: pad.x + pad.w/2 - 7, y: pad.y - 4 });
    }
  }
  bb.bolts.forEach(bolt=>{
    bolt.y -= 620*dt;
    for(const br of bb.bricks){
      if(br.alive && bolt.x>=br.x && bolt.x<=br.x+br.w && bolt.y<=br.y+br.h && bolt.y>=br.y-12){ bbHitBrick(bb, br); bolt.dead = true; break; }
    }
    if(bolt.y < -12) bolt.dead = true;
  });
  bb.bolts = bb.bolts.filter(b=>!b.dead);

  const sp = bbSpeed(bb);
  const sticky = bb.time < bb.stickyUntil;
  bb.balls.forEach(b=>{
    if(b.stuck){ b.x = pad.x + b.offset; b.y = pad.y - b.r - 1; return; }
    const steps = Math.max(1, Math.ceil(sp*dt/4));
    for(let s=0; s<steps && !b.dead && !b.stuck; s++){
      b.x += b.vx*dt/steps; b.y += b.vy*dt/steps;
      if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); }
      if(b.x > BB_W-b.r){ b.x = BB_W-b.r; b.vx = -Math.abs(b.vx); }
      if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); }
      // Paddle: where it lands on the paddle decides the bounce angle (up to 60 degrees).
      if(b.vy>0 && b.y + b.r >= pad.y && b.y - b.r <= pad.y + pad.h && b.x >= pad.x - pad.w/2 - b.r && b.x <= pad.x + pad.w/2 + b.r){
        const rel = Math.max(-1, Math.min(1, (b.x - pad.x)/(pad.w/2)));
        if(sticky){
          b.stuck = true; b.offset = b.x - pad.x; b.y = pad.y - b.r - 1; b.vx = 0; b.vy = 0;
          bb.banner = 'Tap to let go'; bb.bannerUntil = bb.time + 1.5;
        }else{
          const ang = rel * (Math.PI/3) + (Math.random()-0.5)*0.2;
          b.vx = Math.sin(ang)*sp; b.vy = -Math.cos(ang)*sp; b.y = pad.y - b.r;
        }
        continue;
      }
      for(const br of bb.bricks){
        if(!br.alive) continue;
        const cx = Math.max(br.x, Math.min(b.x, br.x+br.w));
        const cy = Math.max(br.y, Math.min(b.y, br.y+br.h));
        const nx = b.x - cx, ny = b.y - cy;
        if(nx*nx + ny*ny < b.r*b.r){
          if(nx===0 && ny===0) b.vy = -b.vy;
          else if(Math.abs(nx) > Math.abs(ny)){ b.vx = Math.sign(nx)*Math.abs(b.vx); b.x = cx + Math.sign(nx)*b.r; }
          else { b.vy = Math.sign(ny)*Math.abs(b.vy); b.y = cy + Math.sign(ny)*b.r; }
          bbHitBrick(bb, br);
          break;
        }
      }
      if(b.y > BB_H + b.r*2) b.dead = true;
    }
    if(!b.dead && !b.stuck) bbFixAngle(b, sp);
  });
  bb.balls = bb.balls.filter(b=>!b.dead);

  bb.drops.forEach(d=>{
    d.y += 125*dt;
    if(d.y + 14 >= pad.y && d.y - 14 <= pad.y + pad.h && d.x >= pad.x - pad.w/2 - 10 && d.x <= pad.x + pad.w/2 + 10){ d.dead = true; bbActivate(bb, d.kind); }
    if(d.y > BB_H + 20) d.dead = true;
  });
  bb.drops = bb.drops.filter(d=>!d.dead);

  if(!bb.balls.length){
    bb.lives--;
    if(bb.lives<=0){ bb.over = true; return; }
    bb.balls = [bbNewBall(bb)];
    bb.banner = `Oops! ${bb.lives} ${bb.lives===1?'life':'lives'} left, tap to launch`; bb.bannerUntil = bb.time + 2.5;
  }
  if(bb.bricks.every(br=>!br.alive)){
    bb.levelClearT = 1.6; bb.balls = []; bb.drops = []; bb.bolts = [];
    bb.banner = 'Wall cleared! \uD83C\uDF89'; bb.bannerUntil = bb.time + 1.6;
  }
}
let bbBgCanvas = null;
function bbBackground(dpr){
  if(bbBgCanvas && bbBgCanvas._dpr===dpr) return bbBgCanvas;
  const c = document.createElement('canvas');
  c.width = BB_W*dpr; c.height = BB_H*dpr; c._dpr = dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  x.fillStyle = FOIL.bg; x.fillRect(0,0,BB_W,BB_H);
  [[0.1,0.1,FOIL.pink],[0.9,0.15,FOIL.blue],[0.12,0.9,FOIL.lime],[0.88,0.85,FOIL.gold]].forEach(([px,py,col])=>{
    const g = x.createRadialGradient(px*BB_W, py*BB_H, 0, px*BB_W, py*BB_H, BB_W*0.45);
    g.addColorStop(0, col+'33'); g.addColorStop(1, col+'00');
    x.fillStyle = g; x.fillRect(0,0,BB_W,BB_H);
  });
  x.fillStyle = 'rgba(34,26,61,0.07)';
  for(let gy=12; gy<BB_H; gy+=24) for(let gx=12; gx<BB_W; gx+=24) x.fillRect(gx-1, gy-1, 2, 2);
  bbBgCanvas = c;
  return c;
}
function bbDraw(bb){
  const cv = prepCanvas('bb-canvas', BB_W, BB_H);
  if(!cv) return;
  const { ctx, dpr } = cv;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bbBackground(dpr), 0, 0);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // Bricks as stickers; power-up bricks get the holographic foil finish and their icon.
  bb.bricks.forEach(br=>{
    if(!br.alive) return;
    const fill = br.power ? holoGradient(ctx, br.x, br.y, br.x+br.w, br.y+br.h) : br.colour;
    stickerRect(ctx, br.x, br.y, br.w, br.h, 6, fill, 2);
    if(br.maxHp>1){
      ctx.strokeStyle = FOIL.ink; ctx.lineWidth = 2;
      rrPath(ctx, br.x+4, br.y+4, br.w-8, br.h-8, 4); ctx.stroke();
      if(br.hp<br.maxHp){
        ctx.beginPath(); ctx.moveTo(br.x+br.w*0.3, br.y+2); ctx.lineTo(br.x+br.w*0.45, br.y+br.h*0.55); ctx.lineTo(br.x+br.w*0.38, br.y+br.h-2); ctx.stroke();
      }
    }
    if(br.power){
      ctx.font = `14px ${GAME_EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(BB_POWERS[br.power].emoji, br.x+br.w/2, br.y+br.h/2+1);
    }
  });
  // Falling power-ups
  bb.drops.forEach(d=>{
    ctx.fillStyle = FOIL.ink; ctx.beginPath(); ctx.arc(d.x+2, d.y+2, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = BB_POWERS[d.kind].colour; ctx.beginPath(); ctx.arc(d.x, d.y, 14, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = FOIL.ink; ctx.stroke();
    ctx.font = `15px ${GAME_EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(BB_POWERS[d.kind].emoji, d.x, d.y+1);
  });
  // Laser bolts
  ctx.fillStyle = FOIL.pink;
  bb.bolts.forEach(bolt=>{ rrPath(ctx, bolt.x-2, bolt.y-12, 4, 12, 2); ctx.fill(); });
  // Paddle
  const pad = bb.paddle;
  const px = pad.x - pad.w/2;
  if(bb.time < bb.laserUntil){
    stickerRect(ctx, px+1, pad.y-8, 12, 12, 3, FOIL.ink, 0);
    stickerRect(ctx, px+pad.w-13, pad.y-8, 12, 12, 3, FOIL.ink, 0);
    ctx.fillStyle = FOIL.pink; ctx.fillRect(px+5, pad.y-10, 4, 4); ctx.fillRect(px+pad.w-9, pad.y-10, 4, 4);
  }
  stickerRect(ctx, px, pad.y, pad.w, pad.h, pad.h/2, holoGradient(ctx, px, 0, px+pad.w, 0), 3);
  if(bb.time < bb.stickyUntil){
    ctx.strokeStyle = FOIL.lime; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px+8, pad.y+1); ctx.lineTo(px+pad.w-8, pad.y+1); ctx.stroke();
  }
  // Balls
  bb.balls.forEach(b=>{
    ctx.fillStyle = FOIL.ink; ctx.beginPath(); ctx.arc(b.x+2, b.y+2, b.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = FOIL.white; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = FOIL.ink; ctx.stroke();
    ctx.fillStyle = FOIL.blue; ctx.beginPath(); ctx.arc(b.x-2.5, b.y-2.5, 2.2, 0, Math.PI*2); ctx.fill();
  });
  // Banner message
  if(bb.time < bb.bannerUntil || bb.balls.some(b=>b.stuck)){
    const msg = bb.time < bb.bannerUntil ? bb.banner : 'Tap to launch';
    ctx.font = `700 18px 'Baloo 2', sans-serif`;
    const w = Math.min(BB_W-40, ctx.measureText(msg).width + 32);
    stickerRect(ctx, BB_W/2 - w/2, BB_H*0.6 - 18, w, 36, 18, FOIL.white, 3);
    ctx.fillStyle = FOIL.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(msg, BB_W/2, BB_H*0.6+1);
  }
  // Keep the Sevling face badge sitting on the middle of the paddle
  const face = document.getElementById('bb-face');
  if(face){ face.style.left = (pad.x/BB_W*100)+'%'; face.style.top = ((pad.y+pad.h/2)/BB_H*100)+'%'; }
}
function bbLoopStep(dt){
  const bb = state.brick;
  if(state.view!=='arcade-brick' || !bb) return false;
  bbStep(bb, dt);
  bbDraw(bb);
  setTextIfChanged('bb-lives', '\u2764\uFE0F'.repeat(Math.max(0,bb.lives)) || '0');
  setTextIfChanged('bb-score', String(bb.score));
  setTextIfChanged('bb-level', String(bb.level));
  if(bb.over){ render(); return false; }
  return true;
}
function renderBrickBreaker(){
  if(!state.brick) state.brick = newBrickBreaker();
  const bb = state.brick;
  const charId = game.selectedBrickSevling;
  const charSevling = charId ? SEVLINGS.find(x=>x.id===charId) : null;
  const hasTime = (game.arcadeMs||0) > 0;
  app.innerHTML = `
    <button class="btn-ghost" id="btn-back-arcade">\u2190 Back to Arcade</button>
    <h2 class="section-title">Brick Breaker</h2>
    <p class="progress" style="text-align:center;">Level <span id="bb-level">${bb.level}</span> &nbsp;\u00B7&nbsp; Score <span id="bb-score">${bb.score}</span> &nbsp;\u00B7&nbsp; <span id="bb-lives">${'\u2764\uFE0F'.repeat(Math.max(0,bb.lives))}</span> &nbsp;\u00B7&nbsp; Arcade time left: <span id="arcade-timer">${formatMs(game.arcadeMs||0)}</span></p>
    ${bb.wonItemName ? `<div class="card reward-card" style="border-top-color:var(--gold);"><p class="muted" style="text-align:center;margin:0;">\uD83C\uDF81 You won ${escapeHtml(bb.wonItemName)} for ${escapeHtml(charSevling?charSevling.name:'your Sevling')}! Happiness +15</p></div>` : ''}
    ${bb.over ? `<div class="card"><p class="muted" style="text-align:center;margin:0;">Game over! You broke ${bb.bricksBroken} brick${bb.bricksBroken===1?'':'s'} and scored ${bb.score}.</p></div>` : ''}
    ${(!hasTime) ? `<div class="card"><p class="muted" style="text-align:center;font-size:0.85rem;margin:0;">${bb.over ? 'Out of arcade time, score 90%+ three times on a list to earn more!' : 'Your arcade time has run out, but you can finish this game.'}</p></div>` : ''}
    <div class="card game-card">
      <div class="game-stage" style="aspect-ratio:${BB_W}/${BB_H};">
        <canvas id="bb-canvas" class="game-canvas" aria-label="Brick Breaker board, drag to move the paddle, tap to launch"></canvas>
        ${charSevling ? `<div id="bb-face" class="game-face" style="width:${(34/BB_W*100).toFixed(2)}%;">${sevlingIcon(charSevling,false,true)}</div>` : ''}
      </div>
    </div>
    <p class="muted" style="text-align:center;margin:0.2rem 0 0;">Slide your finger along the board to move, tap to launch. Catch the falling icons for power-ups.</p>
    <div class="btn-row" style="margin-top:1rem;justify-content:center;">
      <button class="btn-secondary" id="btn-bb-restart" ${hasTime?'':'disabled'}>New game</button>
    </div>
  `;
  document.getElementById('btn-back-arcade').onclick = ()=>{ stopAllArcadeIntervals(); state.view='arcade'; render(); };
  document.getElementById('btn-bb-restart').onclick = ()=>{ if((game.arcadeMs||0)<=0) return; stopAllArcadeIntervals(); state.brick = newBrickBreaker(); render(); };
  const canvas = document.getElementById('bb-canvas');
  const toLogicalX = (e)=>{ const r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / r.width * BB_W; };
  canvas.onpointerdown = (e)=>{ e.preventDefault(); try{ canvas.setPointerCapture(e.pointerId); }catch(_){} if(state.brick) state.brick.pointerX = toLogicalX(e); bbLaunch(); };
  canvas.onpointermove = (e)=>{ if(state.brick && (e.pointerType==='mouse' || e.buttons)) state.brick.pointerX = toLogicalX(e); };
  bbDraw(bb);
  if(!bb.over){
    startArcadeRaf(bbLoopStep);
    if(hasTime) startArcadeCountdown(()=>render());
  }else{
    stopAllArcadeIntervals();
  }
}

// ---- Overhead Racer ----
// Top-down racing on a winding neon track against two computer cars. Every 10 seconds of
// racing the race pauses for a spelling from the chosen list(s); a correct answer (graded by
// the same gradeSpelling() as practice mode) gives a turbo boost. The arcade clock is paused
// while a spelling question is on screen, so spelling never eats into play time.
const RACER_VIEW = 480;           // logical canvas size (square)
const RACER_ZOOM = 0.8;           // canvas px per world unit
const RACER_HALF_W = 62;          // half the track width
const RACER_BARRIER = 30;         // soft cushion beyond the track edge before the car is held back
const RACER_LAPS = 3;
const RACER_MAX_SPEED = 260;
const RACER_PROMPT_EVERY = 10;    // seconds of racing between spelling questions
const RACER_FLASH_MS = 1000;      // how long a pit-stop word stays visible before fading
const RACER_SPACING = 12;         // world units between centreline samples
const RACER_CONTROL_POINTS = [[300,250],[750,180],[1150,280],[1480,260],[1640,520],[1480,780],[1140,790],[980,960],[1160,1150],[1500,1200],[1580,1420],[1250,1540],[800,1500],[540,1320],[640,1040],[440,840],[230,740],[190,470]];
const RACER_DIFFICULTY = {
  gentle: { label:'Gentle', ai:0.78, assist:2.0, maxDev:1.15, leadBrake:[[20,0.82],[50,0.68],[110,0.55]], catchUp:1.04 },
  speedy: { label:'Speedy', ai:0.88, assist:0.7, maxDev:1.9, leadBrake:[[40,0.9],[100,0.8]], catchUp:1.06 }
};
const RACER_BOOSTS = [[0.1,0],[0.36,22],[0.6,-22],[0.84,0]];      // [fraction round the lap, lane offset]
const RACER_OILS = [[0.23,-26],[0.48,26],[0.72,-18],[0.95,20]];
let racerTrackCache = null;
function racerBuildTrack(){
  if(racerTrackCache) return racerTrackCache;
  const ctrl = RACER_CONTROL_POINTS, n = ctrl.length, raw = [];
  for(let i=0;i<n;i++){
    const p0=ctrl[(i-1+n)%n], p1=ctrl[i], p2=ctrl[(i+1)%n], p3=ctrl[(i+2)%n];
    for(let s=0;s<30;s++){
      const t=s/30, t2=t*t, t3=t2*t;
      const cr = (a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      raw.push([cr(p0[0],p1[0],p2[0],p3[0]), cr(p0[1],p1[1],p2[1],p3[1])]);
    }
  }
  let total = 0; const cum = [0];
  for(let i=1;i<=raw.length;i++){ const a=raw[i-1], b=raw[i%raw.length]; total += Math.hypot(b[0]-a[0], b[1]-a[1]); cum.push(total); }
  const N = Math.round(total/RACER_SPACING), pts = [];
  let j = 0;
  for(let k=0;k<N;k++){
    const d = k*total/N;
    while(cum[j+1] < d) j++;
    const a=raw[j], b=raw[(j+1)%raw.length], f=(d-cum[j])/((cum[j+1]-cum[j])||1);
    pts.push({ x:a[0]+(b[0]-a[0])*f, y:a[1]+(b[1]-a[1])*f });
  }
  // Shift so there's a margin round the whole track, and the camera never looks past the edge.
  const margin = RACER_VIEW/RACER_ZOOM/2 + 20;
  const minX = Math.min(...pts.map(p=>p.x)), minY = Math.min(...pts.map(p=>p.y));
  pts.forEach(p=>{ p.x += margin - minX; p.y += margin - minY; });
  const worldW = Math.max(...pts.map(p=>p.x)) + margin, worldH = Math.max(...pts.map(p=>p.y)) + margin;
  pts.forEach((p,i)=>{
    const a = pts[(i-1+N)%N], b = pts[(i+1)%N];
    p.ang = Math.atan2(b.y-a.y, b.x-a.x);
    p.nx = -Math.sin(p.ang); p.ny = Math.cos(p.ang);
  });
  const place = (frac, lane)=>{ const p = pts[Math.floor(frac*N)%N]; return { x:p.x+p.nx*lane, y:p.y+p.ny*lane, ang:p.ang, idx:Math.floor(frac*N)%N }; };
  racerTrackCache = { pts, N, worldW, worldH, boosts: RACER_BOOSTS.map(([f,l])=>place(f,l)), oils: RACER_OILS.map(([f,l])=>place(f,l)), image:null, imageScale:0 };
  return racerTrackCache;
}
function racerTrackImage(track, scale){
  if(track.image && track.imageScale===scale) return track.image;
  const c = document.createElement('canvas');
  c.width = Math.round(track.worldW*scale); c.height = Math.round(track.worldH*scale);
  const x = c.getContext('2d'); x.scale(scale, scale);
  // Infield: the app's lavender-white with soft holo blooms and a sticker-sheet dot grid.
  x.fillStyle = FOIL.bg; x.fillRect(0,0,track.worldW,track.worldH);
  [[0.15,0.15,FOIL.pink],[0.85,0.2,FOIL.blue],[0.2,0.85,FOIL.lime],[0.8,0.8,FOIL.gold],[0.5,0.5,FOIL.blue]].forEach(([px,py,col])=>{
    const g = x.createRadialGradient(px*track.worldW, py*track.worldH, 0, px*track.worldW, py*track.worldH, 520);
    g.addColorStop(0, col+'30'); g.addColorStop(1, col+'00');
    x.fillStyle = g; x.fillRect(0,0,track.worldW,track.worldH);
  });
  x.fillStyle = 'rgba(34,26,61,0.08)';
  for(let gy=20; gy<track.worldH; gy+=40) for(let gx=20; gx<track.worldW; gx+=40) x.fillRect(gx-1.5, gy-1.5, 3, 3);
  const loop = (offset)=>{ x.beginPath(); track.pts.forEach((p,i)=>{ const px=p.x+p.nx*offset, py=p.y+p.ny*offset; if(i) x.lineTo(px,py); else x.moveTo(px,py); }); x.closePath(); };
  x.lineJoin = 'round'; x.lineCap = 'round';
  // Hard ink offset shadow under the whole track, like the app's sticker cards.
  x.save(); x.translate(6,6); loop(0); x.strokeStyle = FOIL.ink; x.lineWidth = RACER_HALF_W*2+10; x.stroke(); x.restore();
  loop(0); x.strokeStyle = FOIL.ink; x.lineWidth = RACER_HALF_W*2+10; x.stroke();
  loop(0); x.strokeStyle = '#2E2452'; x.lineWidth = RACER_HALF_W*2-6; x.stroke();
  // Neon edges: pink on one side, blue on the other, with a glow.
  [[-RACER_HALF_W+4, FOIL.pink],[RACER_HALF_W-4, FOIL.blue]].forEach(([off,col])=>{
    x.save(); x.shadowColor = col; x.shadowBlur = 16; loop(off); x.strokeStyle = col; x.lineWidth = 5; x.stroke(); x.restore();
    loop(off); x.strokeStyle = '#FFFFFF'; x.globalAlpha = 0.7; x.lineWidth = 1.5; x.stroke(); x.globalAlpha = 1;
  });
  // Dashed gold centre line
  x.save(); x.setLineDash([18,22]); loop(0); x.strokeStyle = 'rgba(255,212,71,0.55)'; x.lineWidth = 3; x.stroke(); x.restore();
  // Start / finish line, chequered
  const s = track.pts[0];
  x.save(); x.translate(s.x, s.y); x.rotate(s.ang);
  const sq = 10;
  for(let row=0; row<2; row++) for(let k=-RACER_HALF_W+2; k<RACER_HALF_W-2; k+=sq){
    x.fillStyle = (Math.floor(k/sq)+row)%2 ? FOIL.white : FOIL.ink;
    x.fillRect(-sq+row*sq, k, sq, sq);
  }
  x.restore();
  // Oil slicks: dark pools with a holographic sheen
  track.oils.forEach(o=>{
    x.save(); x.translate(o.x, o.y); x.rotate(o.ang);
    x.fillStyle = '#0E0A1C'; x.beginPath(); x.ellipse(0,0,30,22,0,0,Math.PI*2); x.fill();
    x.beginPath(); x.ellipse(-16,10,12,9,0.4,0,Math.PI*2); x.fill();
    const g = x.createLinearGradient(-24,-14,24,14);
    g.addColorStop(0,'rgba(255,62,165,0.55)'); g.addColorStop(0.5,'rgba(0,194,255,0.5)'); g.addColorStop(1,'rgba(196,255,61,0.45)');
    x.strokeStyle = g; x.lineWidth = 5; x.beginPath(); x.ellipse(2,-2,18,11,0,0,Math.PI*2); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,0.75)'; x.lineWidth = 2; x.beginPath(); x.ellipse(0,0,30,22,0,0,Math.PI*2); x.stroke();
    x.fillStyle = 'rgba(255,255,255,0.85)'; x.beginPath(); x.arc(-8,-8,3,0,Math.PI*2); x.fill(); x.beginPath(); x.arc(10,4,2,0,Math.PI*2); x.fill();
    x.restore();
  });
  // Booster pads: gold sticker plates with ink chevrons pointing the way
  track.boosts.forEach(b=>{
    x.save(); x.translate(b.x, b.y); x.rotate(b.ang);
    x.fillStyle = FOIL.ink; rrPath(x, -26, -17, 56, 38, 8); x.fill();
    x.fillStyle = FOIL.gold; rrPath(x, -29, -20, 56, 38, 8); x.fill();
    x.strokeStyle = FOIL.ink; x.lineWidth = 2; x.stroke();
    x.fillStyle = FOIL.ink;
    [-14, 2].forEach(cx=>{ x.beginPath(); x.moveTo(cx,-11); x.lineTo(cx+12,-1); x.lineTo(cx,9); x.lineTo(cx+5,-1); x.closePath(); x.fill(); });
    x.restore();
  });
  track.image = c; track.imageScale = scale;
  return c;
}
function racerNearestIdx(track, car){
  let best = car.idx, bestD = Infinity;
  for(let k=-20; k<=40; k++){
    const i = (car.idx + k + track.N) % track.N, p = track.pts[i];
    const d = (p.x-car.x)**2 + (p.y-car.y)**2;
    if(d < bestD){ bestD = d; best = i; }
  }
  return best;
}
function angleDiff(a, b){ let d = a - b; while(d > Math.PI) d -= Math.PI*2; while(d < -Math.PI) d += Math.PI*2; return d; }
function newRacerCar(track, lane, colour, isPlayer, name){
  const p = track.pts[4];
  return { x:p.x+p.nx*lane, y:p.y+p.ny*lane, angle:p.ang, speed:0, idx:4, laps:0, colour, isPlayer, name,
    turboT:0, turboMul:1, spinT:0, spinHeading:0, spinAngle:0, hazardCooldown:0, offTrack:false,
    lane, lanePhase:Math.random()*Math.PI*2, finished:false, finishOrder:0 };
}
function newRacer(pool, difficulty){
  const track = racerBuildTrack();
  return {
    track, difficulty: RACER_DIFFICULTY[difficulty] ? difficulty : 'speedy',
    cars: [ newRacerCar(track, -36, FOIL.pink, true, 'You'), newRacerCar(track, 0, FOIL.blue, false, 'Blue'), newRacerCar(track, 36, FOIL.gold, false, 'Gold') ],
    phase:'countdown', countdown:3.4, time:0, sincePrompt:0, pool: shuffle(pool), poolIdx:0,
    prompt:null, finishCount:0, place:0, boostsEarned:0, questions:0, steerTouch:0,
    banner:'', bannerUntil:0, wonItemName:null
