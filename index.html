}
function racerProgress(track, car){ return car.laps*track.N + car.idx; }
function racerUpdateCar(r, car, dt, steerInput){
  const track = r.track;
  const cfg = RACER_DIFFICULTY[r.difficulty];
  if(car.hazardCooldown>0) car.hazardCooldown -= dt;
  if(car.turboT>0) car.turboT -= dt;
  if(car.spinT>0){
    // Spinning out on oil: the car twirls, slows right down, then carries on in its old direction.
    car.spinT -= dt;
    car.spinAngle += dt*13;
    car.speed += (RACER_MAX_SPEED*0.25 - car.speed) * Math.min(1, dt*4);
    car.x += Math.cos(car.spinHeading)*car.speed*dt; car.y += Math.sin(car.spinHeading)*car.speed*dt;
    car.angle = car.spinHeading + car.spinAngle;
    if(car.spinT<=0){ car.angle = car.spinHeading; car.hazardCooldown = 1.2; }
  }else{
    let target;
    if(car.isPlayer){
      target = RACER_MAX_SPEED;
      const turnRate = 3.2 * Math.min(1, car.speed/110);
      car.angle += steerInput * turnRate * dt;
      if(!steerInput){
        // Steering assist: with no input the car gently aims at the track a little way ahead.
        const ahead = track.pts[(car.idx + 8) % track.N];
        const want = Math.atan2(ahead.y - car.y, ahead.x - car.x);
        const d = angleDiff(want, car.angle);
        car.angle += Math.max(-cfg.assist*dt, Math.min(cfg.assist*dt, d));
      }
      // The car can never turn to face backwards (gentle keeps it within about 65 degrees of the
      // track's direction), so over-steering slows you down but never sends you the wrong way.
      const trackAng = track.pts[car.idx].ang;
      const dev = angleDiff(car.angle, trackAng);
      if(Math.abs(dev) > cfg.maxDev) car.angle = trackAng + Math.sign(dev)*cfg.maxDev;
    }else{
      const lane = car.lane*0.5 + Math.sin(r.time*0.45 + car.lanePhase)*20;
      const aim = track.pts[(car.idx + 10) % track.N];
      const want = Math.atan2(aim.y + aim.ny*lane - car.y, aim.x + aim.nx*lane - car.x);
      const d = angleDiff(want, car.angle);
      car.angle += Math.max(-3.6*dt, Math.min(3.6*dt, d));
      const bend = Math.abs(angleDiff(track.pts[(car.idx+22)%track.N].ang, track.pts[car.idx].ang));
      target = RACER_MAX_SPEED * cfg.ai * (1 - Math.min(0.28, bend*0.35));
      // Rubber-banding, weighted in the player's favour: computer cars ease off when ahead.
      const player = r.cars[0];
      const gap = racerProgress(track, car) - racerProgress(track, player);
      let band = 1;
      cfg.leadBrake.forEach(([g,m])=>{ if(gap > g) band = m; });
      if(gap < -90) band = cfg.catchUp;
      if(!player.finished) target *= band;
    }
    if(car.offTrack) target *= 0.5;
    if(car.turboT>0) target *= car.turboMul;
    const accel = target > car.speed ? 200 : 320;
    car.speed += Math.max(-accel*dt, Math.min(accel*dt, target - car.speed));
    car.x += Math.cos(car.angle)*car.speed*dt; car.y += Math.sin(car.angle)*car.speed*dt;
  }
  // Where are we on the track? Lap counting happens when we cross the start line.
  const prev = car.idx;
  car.idx = racerNearestIdx(track, car);
  if(prev > track.N*0.7 && car.idx < track.N*0.3) car.laps++;
  else if(prev < track.N*0.3 && car.idx > track.N*0.7) car.laps--;
  const c = track.pts[car.idx];
  const lat = (car.x - c.x)*c.nx + (car.y - c.y)*c.ny;
  car.offTrack = Math.abs(lat) > RACER_HALF_W;
  const limit = RACER_HALF_W + RACER_BARRIER;
  if(Math.abs(lat) > limit){
    const push = Math.abs(lat) - limit;
    car.x -= Math.sign(lat)*c.nx*push; car.y -= Math.sign(lat)*c.ny*push;
    car.speed = Math.min(car.speed, RACER_MAX_SPEED*0.45);
  }
  // Hazards and boosters
  if(car.spinT<=0){
    track.boosts.forEach(b=>{
      const dx = car.x-b.x, dy = car.y-b.y;
      const along = dx*Math.cos(b.ang) + dy*Math.sin(b.ang), across = -dx*Math.sin(b.ang) + dy*Math.cos(b.ang);
      if(Math.abs(along) < 32 && Math.abs(across) < 24){
        if(car.turboT < 1.3){ car.turboT = 1.3; car.turboMul = 1.4; }
        car.speed = Math.max(car.speed, RACER_MAX_SPEED*1.2);
        if(car.isPlayer){ r.banner = 'Boost! \uD83D\uDE80'; r.bannerUntil = r.time + 1; }
      }
    });
    if(car.hazardCooldown<=0){
      track.oils.forEach(o=>{
        if(car.spinT<=0 && Math.hypot(car.x-o.x, car.y-o.y) < 28){
          car.spinT = 0.9; car.spinHeading = car.angle; car.spinAngle = 0; car.turboT = 0;
          if(car.isPlayer){ r.banner = 'Oil! Wheee! \uD83C\uDF00'; r.bannerUntil = r.time + 1.2; }
        }
      });
    }
  }
  if(!car.finished && car.laps >= RACER_LAPS){
    car.finished = true; r.finishCount++; car.finishOrder = r.finishCount;
  }
}
function racerStep(r, dt){
  if(r.prompt || r.phase==='finished') return;
  r.time += dt;
  if(r.phase==='countdown'){
    r.countdown -= dt;
    if(r.countdown <= 0){ r.phase = 'racing'; r.banner = 'Go! \uD83C\uDFC1'; r.bannerUntil = r.time + 1; }
    return;
  }
  const steer = r.steerTouch || ((heldKeys['ArrowRight']?1:0) - (heldKeys['ArrowLeft']?1:0));
  r.cars.forEach(car=>racerUpdateCar(r, car, dt, car.isPlayer ? steer : 0));
  // Gentle bumps between cars, no damage, just nudged apart.
  for(let i=0;i<r.cars.length;i++) for(let j=i+1;j<r.cars.length;j++){
    const a = r.cars[i], b = r.cars[j];
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy);
    if(d > 0 && d < 24){ const push = (24-d)/2; a.x -= dx/d*push; a.y -= dy/d*push; b.x += dx/d*push; b.y += dy/d*push; }
  }
  const player = r.cars[0];
  if(player.finished){
    r.phase = 'finished';
    r.place = player.finishOrder;
    const sevlingId = game.selectedRacerSevling;
    if(sevlingId) awardSevlingItem(sevlingId).then(itemName=>{ r.wonItemName = itemName; if(state.view==='arcade-racer' && state.racer===r) render(); });
    r.needsRender = true;
    return;
  }
  if(r.pool.length){
    r.sincePrompt += dt;
    if(r.sincePrompt >= RACER_PROMPT_EVERY) racerOpenPrompt(r);
  }
}
function racerPositions(r){
  return r.cars.slice().sort((a,b)=>{
    if(a.finished && b.finished) return a.finishOrder - b.finishOrder;
    if(a.finished) return -1; if(b.finished) return 1;
    return racerProgress(r.track, b) - racerProgress(r.track, a);
  });
}
function racerDrawCar(ctx, car){
  ctx.save(); ctx.translate(car.x, car.y);
  if(car.turboT>0 && car.spinT<=0){
    // Holographic turbo trail
    ctx.save(); ctx.rotate(car.angle);
    [[-26,8,FOIL.gold],[-36,6,FOIL.pink],[-45,4,FOIL.blue]].forEach(([tx,rad,col])=>{ ctx.globalAlpha = 0.85; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tx + Math.random()*3, (Math.random()-0.5)*4, rad, 0, Math.PI*2); ctx.fill(); });
    ctx.restore(); ctx.globalAlpha = 1;
  }
  ctx.scale(1.2, 1.2);
  ctx.save(); ctx.translate(3,3); ctx.rotate(car.angle); ctx.fillStyle = FOIL.ink; rrPath(ctx, -17, -10, 34, 20, 7); ctx.fill(); ctx.restore();
  ctx.rotate(car.angle);

  ctx.fillStyle = car.colour; rrPath(ctx, -17, -10, 34, 20, 7); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = FOIL.ink; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; rrPath(ctx, 4, -7, 7, 14, 3); ctx.fill(); ctx.strokeStyle = FOIL.ink; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = FOIL.ink; ctx.fillRect(-17, -8, 3, 16);

  ctx.restore();
}
function racerDraw(r){
  const cv = prepCanvas('racer-canvas', RACER_VIEW, RACER_VIEW);
  if(!cv) return;
  const { ctx, dpr } = cv;
  const track = r.track;
  const player = r.cars[0];
  const half = RACER_VIEW/RACER_ZOOM/2;
  const camX = Math.max(half, Math.min(track.worldW - half, player.x));
  const camY = Math.max(half, Math.min(track.worldH - half, player.y));
  // The pre-drawn track image is capped at about 8 million pixels, comfortably inside iOS canvas limits.
  const img = racerTrackImage(track, Math.min(dpr, Math.sqrt(8e6/(track.worldW*track.worldH))));
  const sc = img.width / track.worldW;
  const sx = Math.max(0, (camX-half)*sc), sy = Math.max(0, (camY-half)*sc);
  const sw = Math.min(half*2*sc, img.width - sx), sh = Math.min(half*2*sc, img.height - sy);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cv.c.width, cv.c.height);
  const z = RACER_ZOOM*dpr;
  ctx.setTransform(z,0,0,z, (half-camX)*z, (half-camY)*z);
  // Pulse the booster pads so they read as "go faster" spots
  const pulse = 0.25 + 0.2*Math.sin(r.time*6);
  track.boosts.forEach(b=>{
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    ctx.globalAlpha = pulse; ctx.strokeStyle = FOIL.lime; ctx.lineWidth = 4; rrPath(ctx, -33, -24, 64, 46, 12); ctx.stroke();
    ctx.restore();
  });
  ctx.globalAlpha = 1;
  r.cars.slice().reverse().forEach(car=>racerDrawCar(ctx, car));
  // HUD drawn in screen space
  ctx.setTransform(dpr,0,0,dpr,0,0);
  racerDrawMinimap(ctx, r);
  let msg = '';
  if(r.phase==='countdown') msg = r.countdown > 2.4 ? '3' : r.countdown > 1.4 ? '2' : r.countdown > 0.4 ? '1' : 'Go!';
  else if(r.time < r.bannerUntil) msg = r.banner;
  if(msg){
    const big = r.phase==='countdown';
    ctx.font = `800 ${big?44:22}px 'Baloo 2', sans-serif`;
    const w = ctx.measureText(msg).width + (big?48:32), h = big?64:40;
    stickerRect(ctx, RACER_VIEW/2 - w/2, RACER_VIEW*0.22 - h/2, w, h, h/2, big ? holoGradient(ctx, RACER_VIEW/2-w/2, 0, RACER_VIEW/2+w/2, 0) : FOIL.white, 3);
    ctx.fillStyle = FOIL.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(msg, RACER_VIEW/2, RACER_VIEW*0.22 + 2);
  }

  const face = document.getElementById('racer-face');
  if(face){
    const sx = (player.x - camX + half)*RACER_ZOOM, sy = (player.y - camY + half)*RACER_ZOOM;
    face.style.left = (sx/RACER_VIEW*100)+'%'; face.style.top = (sy/RACER_VIEW*100)+'%';
  }
}
function racerDrawMinimap(ctx, r){
  const track = r.track, mw = 116, mh = Math.round(mw*track.worldH/track.worldW), mx = RACER_VIEW - mw - 12, my = 12;
  stickerRect(ctx, mx, my, mw, mh, 10, FOIL.white, 2);
  const s = Math.min((mw-16)/track.worldW, (mh-16)/track.worldH);
  const ox = mx + 8, oy = my + 8;
  ctx.beginPath();
  track.pts.forEach((p,i)=>{ const x = ox + p.x*s, y = oy + p.y*s; if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
  ctx.closePath(); ctx.strokeStyle = FOIL.ink; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
  r.cars.slice().reverse().forEach(car=>{
    ctx.fillStyle = car.colour; ctx.beginPath(); ctx.arc(ox + car.x*s, oy + car.y*s, car.isPlayer?5:4, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = FOIL.ink; ctx.stroke();
  });
}
function racerLoopStep(dt){
  const r = state.racer;
  if(state.view!=='arcade-racer' || !r) return false;
  racerStep(r, dt);
  racerDraw(r);
  const player = r.cars[0];
  const pos = racerPositions(r).indexOf(player) + 1;
  setTextIfChanged('racer-lap', `${Math.min(RACER_LAPS, Math.max(1, player.laps+1))}/${RACER_LAPS}`);
  setTextIfChanged('racer-pos', ordinal(pos));
  if(r.needsRender){ r.needsRender = false; render(); }
  return r.phase!=='finished';
}

let racerRevealTimer = null;
function clearRacerRevealTimer(){ if(racerRevealTimer){ clearTimeout(racerRevealTimer); racerRevealTimer = null; } }
function racerNextItem(r){
  if(r.poolIdx >= r.pool.length){ r.pool = shuffle(r.pool); r.poolIdx = 0; }
  return r.pool[r.poolIdx++];
}
function racerOpenPrompt(r){
  const item = racerNextItem(r);
  r.questions++;
  r.prompt = { item, input:'', checked:false, lastCorrect:false, accentMissing:false, wordRevealed:false, wordHidden:false, started:false };
  r.steerTouch = 0;
  pauseArcadeCountdown();
  r.needsRender = true;
}
function racerResume(){
  const r = state.racer;
  if(!r || !r.prompt) return;
  clearRacerRevealTimer();
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  r.prompt = null; r.sincePrompt = 0;
  render();
}
function racerCheck(){
  const r = state.racer;
  if(!r || !r.prompt || r.prompt.checked) return;
  const q = r.prompt, info = modeInfo(q.item.mode);
  const result = gradeSpelling(q.input, q.item.word[info.gradeField]);
  q.checked = true; q.lastCorrect = result.correct; q.accentMissing = result.accentMissing;
  clearRacerRevealTimer();
  if(result.correct){
    const player = r.cars[0];
    player.turboT = 2.6; player.turboMul = 1.55; player.speed = Math.max(player.speed, RACER_MAX_SPEED*1.3);
    r.boostsEarned++;
    r.banner = 'Spelling turbo! \uD83D\uDE80'; r.bannerUntil = r.time + 2;
  }
  render();
  // A clean correct answer gets straight back to racing; a near miss or wrong answer waits
  // for "Keep racing" so there's time to read the correct spelling.
  if(result.correct && !result.accentMissing){
    const thisPrompt = q;
    setTimeout(()=>{ if(state.racer===r && r.prompt===thisPrompt) racerResume(); }, 1300);
  }
}
function racerPromptHtml(r){

  const speakFirst = q.item.mode==='copy' ? { text: word.english, lang:'en-GB' } : null;
  const wordVisible = !info.revealTimer || (q.wordRevealed && !q.wordHidden);
  return `<div class="racer-prompt">

function racerWirePrompt(r){
  const q = r.prompt, info = modeInfo(q.item.mode), word = q.item.word;
  const input = document.getElementById('racer-answer');
  if(input){
    if(!q.checked) input.focus();
    input.oninput = (e)=>{ q.input = e.target.value; };
    input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); if(q.checked) racerResume(); else racerCheck(); } };
  }
  const checkBtn = document.getElementById('racer-check'); if(checkBtn) checkBtn.onclick = racerCheck;
  const contBtn = document.getElementById('racer-continue');
  if(contBtn){ contBtn.onclick = racerResume; if(!input || input.disabled) contBtn.focus(); }
  // Same listen-then-reveal-then-fade sequence as the practice screen's copy modes, but the
  // word only flashes up for 1 second here (practice mode shows it for 4s, or 3s once mastered).
  if(!q.started && !q.checked){
    q.started = true;
    const shownWord = word[info.shownField] || '';
    const visibleMs = RACER_FLASH_MS;
    speakSequence(info.audio(word)).then(()=>{
      if(!info.revealTimer || state.racer!==r || r.prompt!==q || q.checked) return;

        racerRevealTimer = null;

        if(el2) el2.classList.add('word-faded');
        setTimeout(()=>{
          if(state.racer===r && r.prompt===q && !q.checked){
            q.wordHidden = true;
            const el3 = document.getElementById('racer-shown-word');
            if(el3) el3.textContent = '';

        }, 450);
      }, visibleMs);
    });
  }
}

// ---- Word Search ----
const WORDSEARCH_DIRS = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1},{dx:1,dy:1},{dx:-1,dy:-1},{dx:1,dy:-1},{dx:-1,dy:1}];
function generateWordSearchGrid(words, size){
  const grid = Array.from({length:size}, ()=>Array(size).fill(null));
  const placements = [];
  const sorted = words.slice().sort((a,b)=>b.length-a.length);
  for(const word of sorted){
    const letters = word.toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÑ]/g,'');
    if(!letters) continue;
    let placed = false;
    for(let attempt=0; attempt<300 && !placed; attempt++){
      const dir = WORDSEARCH_DIRS[Math.floor(Math.random()*WORDSEARCH_DIRS.length)];
      const startX = Math.floor(Math.random()*size), startY = Math.floor(Math.random()*size);
      const endX = startX+dir.dx*(letters.length-1), endY = startY+dir.dy*(letters.length-1);
      if(endX<0||endX>=size||endY<0||endY>=size) continue;
      let ok = true;
      for(let i=0;i<letters.length;i++){
        const cx=startX+dir.dx*i, cy=startY+dir.dy*i;
        if(grid[cy][cx]!==null && grid[cy][cx]!==letters[i]){ ok=false; break; }
      }
      if(!ok) continue;
      const cells=[];
      for(let i=0;i<letters.length;i++){ const cx=startX+dir.dx*i, cy=startY+dir.dy*i; grid[cy][cx]=letters[i]; cells.push({x:cx,y:cy}); }
      placements.push({ word, cells, found:false });
      placed = true;
    }
  }
  const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(grid[y][x]===null) grid[y][x] = ALPHA[Math.floor(Math.random()*26)];
  return { grid, placements, size };
}
function newWordSearch(words){
  const cleanWords = (words||[]).map(w=>(w||'').trim()).filter(Boolean);
  const longest = cleanWords.reduce((m,w)=>Math.max(m,w.length),0);
  const size = Math.max(10, Math.min(16, longest+3));
  const ws = generateWordSearchGrid(cleanWords, size);
  return { ...ws, sourceWords: cleanWords, selecting: null };
}
function wordSearchCheckSelection(ws,x1,y1,x2,y2){
  if(Math.abs(x2-x1)!==0 && Math.abs(y2-y1)!==0 && Math.abs(x2-x1)!==Math.abs(y2-y1)) return null;
  const dx = Math.sign(x2-x1), dy = Math.sign(y2-y1);
  const len = Math.max(Math.abs(x2-x1),Math.abs(y2-y1))+1;
  const cells = []; for(let i=0;i<len;i++) cells.push({x:x1+dx*i,y:y1+dy*i});
  for(const p of ws.placements){
    if(p.found) continue;
    const fwd = p.cells.length===cells.length && p.cells.every((c,i)=>c.x===cells[i].x&&c.y===cells[i].y);
    const bwd = p.cells.length===cells.length && p.cells.every((c,i)=>c.x===cells[cells.length-1-i].x&&c.y===cells[cells.length-1-i].y);
    if(fwd||bwd) return p;
  }
  return null;
}
function wordSearchTapCell(x,y){
  const ws = state.wordSearch;
  if(!ws) return;
  if(!ws.selecting){
    ws.selecting = {x,y};
  }else{
    const match = wordSearchCheckSelection(ws, ws.selecting.x, ws.selecting.y, x, y);
    if(match) match.found = true;
    ws.selecting = null;
  }
  render();
}

function renderWordSearch(){
  const ws = state.wordSearch;
  if(!ws){ state.view='wordsearch-pick'; render(); return; }
  const cellPct = 100/ws.size;
  let cellsHtml = '';
  for(let y=0;y<ws.size;y++){
    for(let x=0;x<ws.size;x++){
      const letter = ws.grid[y][x];
      const isSelecting = ws.selecting && ws.selecting.x===x && ws.selecting.y===y;
      const foundHere = ws.placements.some(p=>p.found && p.cells.some(c=>c.x===x&&c.y===y));
      const bg = isSelecting ? 'var(--gold)' : (foundHere ? 'var(--correct)' : 'transparent');
      const color = (isSelecting||foundHere) ? '#fff' : 'var(--ink)';
      cellsHtml += `<div class="ws-cell" data-x="${x}" data-y="${y}" style="position:absolute;left:${x*cellPct}%;top:${y*cellPct}%;width:${cellPct}%;height:${cellPct}%;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Baloo 2',sans-serif;background:${bg};color:${color};border-radius:4px;cursor:pointer;box-sizing:border-box;">${letter}</div>`;
    }
  }
  const wordListHtml = ws.placements.map(p=>`<span style="display:inline-block;margin:0.15rem 0.3rem;padding:0.25rem 0.6rem;border-radius:8px;background:${p.found?'var(--correct)':'var(--surface)'};color:${p.found?'#fff':'var(--ink)'};border:1.5px solid var(--ink);text-decoration:${p.found?'line-through':'none'};font-size:0.85rem;">${escapeHtml(p.word)}</span>`).join('');
  const allFound = ws.placements.length>0 && ws.placements.every(p=>p.found);
  app.innerHTML = `
    <button class="btn-ghost" id="btn-ws-back">\u2190 Back to Home</button>
    <h2 class="section-title">Word Search</h2>
    ${allFound ? `<div class="card"><p class="muted" style="text-align:center;margin:0;">You found every word! \uD83C\uDF89</p></div>` : `<p class="muted" style="text-align:center;">Tap the first letter, then the last letter of a word.</p>`}
    <div class="card" style="padding:0.5rem;">
      <div style="width:100%;max-width:420px;margin:0 auto;position:relative;">
        <div style="padding-bottom:100%;"></div>
        <div style="position:absolute;top:0;left:0;right:0;bottom:0;">${cellsHtml}</div>
      </div>
    </div>
    <div class="card" style="text-align:center;">${wordListHtml}</div>
    <div class="btn-row" style="margin-top:1rem;justify-content:center;">
      <button class="btn-secondary" id="btn-ws-restart">New puzzle</button>
    </div>
  `;
  document.getElementById('btn-ws-back').onclick = ()=>{ state.view='home'; render(); };
  document.getElementById('btn-ws-restart').onclick = ()=>{ state.wordSearch = newWordSearch(ws.sourceWords); render(); };
  document.querySelectorAll('.ws-cell').forEach(el=>{
    el.onclick = ()=>wordSearchTapCell(+el.dataset.x, +el.dataset.y);
  });
}

function renderSettings(){
  const connected = !!db;
  if(!cachedVoices.length && 'speechSynthesis' in window){
    loadVoices().then(()=>{ if(state.view==='settings') render(); });
  }
  app.innerHTML = `
    ${(authUser && state.currentProfileId) ? navRow('settings') : ''}
    <h2 class="section-title">Settings</h2>
    ${state.error ? `<div class="error-box">${state.error}</div>` : ''}
    ${state.settingsMessage ? `<div class="ok-box">${state.settingsMessage}</div>` : ''}

    <div class="card">
      <h3 style="margin-top:0;">Photo reading (Gemini, optional)</h3>
      <p class="muted">Only needed if you want photos read automatically, you can skip this and add words by hand, or add a key later from the photo upload screen. This key is shared with everyone in your family once saved. Sign in at aistudio.google.com, click \u2018Get API key\u2019, create a free key, and paste it here.</p>
      <input type="text" id="gemini-key" placeholder="Family Gemini API key" value="${escapeHtml(settings.geminiKey||'')}" ${authUser ? '' : 'disabled'}>
      ${!authUser ? `<p class="muted" style="margin-top:-0.5rem;">Sign in first to save this, it lives on your family account rather than this device.</p>` : ''}
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Voice</h3>
      <p class="muted">Choose which of this device's installed voices reads Spanish and English aloud. Saved to this profile, so each person can choose differently, but a device that doesn't have the exact voice picked will fall back to its best automatic match instead.</p>
      <label class="muted" style="display:block;margin-bottom:0.2rem;">Spanish voice</label>
      <select id="voice-es" ${(authUser && state.currentProfileId) ? '' : 'disabled'}>${voiceOptionsHtml(cachedVoices, 'es', settings.voicePrefs && settings.voicePrefs.es && settings.voicePrefs.es.name)}</select>
      <label class="muted" style="display:block;margin:0.6rem 0 0.2rem 0;">English voice</label>
      <select id="voice-en" ${(authUser && state.currentProfileId) ? '' : 'disabled'}>${voiceOptionsHtml(cachedVoices, 'en', settings.voicePrefs && settings.voicePrefs.en && settings.voicePrefs.en.name)}</select>
      ${!(authUser && state.currentProfileId) ? `<p class="muted" style="margin-top:0.5rem;">Select a profile first to save this.</p>` : ''}
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Family invite code</h3>
      <p class="muted">Required for anyone new to sign up, this stops strangers creating accounts if the link ever gets shared outside your family. Change it any time to stop an old code working.</p>
      <input type="text" id="invite-code" placeholder="Invite code" value="${escapeHtml(settings.inviteCode||'')}" ${authUser ? '' : 'disabled'}>
    </div>

    ${(authUser && state.currentProfileId) ? `
    <div class="card">
      <h3 style="margin-top:0;">Testing tools</h3>
      <p class="muted">For trying out and refining the Arcade games without waiting to earn access for real. Only affects this profile.</p>
      <div class="btn-row">
        <button class="btn-secondary" id="btn-add-arcade-time">Add 30 min arcade time</button>
        <button class="btn-secondary" id="btn-unlock-test-sevling">Unlock random Sevling</button>
      </div>
    </div>
    ` : ''}

    <div class="card">
      <h3 style="margin-top:0;">Sync and accounts (Firebase)</h3>
      <p class="muted">In the Firebase console: create a free project, add a Web app, turn on Firestore Database, and turn on Email/Password sign-in under Authentication. Paste the whole firebaseConfig snippet below.</p>
      <textarea class="settings-area" id="firebase-config" rows="6">${escapeHtml(state.firebaseConfigDraft || (settings.firebaseConfig ? JSON.stringify(settings.firebaseConfig, null, 2) : ''))}</textarea>
      <p class="status-line">Status: ${connected ? '\uD83D\uDFE2 Connected' : '\u26AA Not connected yet'}</p>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">App updates</h3>
      <p class="muted">This device is running version <strong>${APP_VERSION}</strong>. The app checks for a newer version each time it opens, use this if it still looks out of date.</p>
      ${state.updateMessage ? `<p class="status-line">${escapeHtml(state.updateMessage)}</p>` : ''}
      <div class="btn-row">
        <button class="btn-secondary" id="btn-check-update">Check for updates</button>
        <button class="btn-secondary" id="btn-force-reload">Reload latest version</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btn-save-settings">Save settings</button>
    </div>
    ${authUser ? `<button class="btn-secondary btn-block" id="btn-settings-back" style="margin-top:0.6rem;">${state.currentProfileId ? '\u2190 Back to Home' : '\u2190 Back to profiles'}</button>` : ''}
  `;
  document.getElementById('btn-check-update').onclick = async ()=>{
    state.updateMessage = 'Checking\u2026'; render();
    const result = await checkForUpdate({ manual:true });
    if(result==='newer'){ state.updateMessage = `Version ${latestSeenVersion} is available, updating now\u2026`; render(); setTimeout(reloadToLatest, 600); return; }
    state.updateMessage = result==='current' ? "You're on the latest version." : "Couldn't reach GitHub to check, try again when you're online.";
    render();
  };
  document.getElementById('btn-force-reload').onclick = ()=>{ state.updateMessage = ''; reloadToLatest(); };
  const backBtn = document.getElementById('btn-settings-back');
  if(backBtn) backBtn.onclick = ()=>{ state.view = state.currentProfileId ? 'home' : 'profiles'; render(); };
  const addTimeBtn = document.getElementById('btn-add-arcade-time');
  if(addTimeBtn) addTimeBtn.onclick = async ()=>{
    game.arcadeMs = (game.arcadeMs||0) + 30*60*1000;
    await saveGame();
    state.settingsMessage = 'Added 30 minutes of arcade time.';
    render();
  };
  const unlockTestBtn = document.getElementById('btn-unlock-test-sevling');
  if(unlockTestBtn) unlockTestBtn.onclick = async ()=>{
    const locked = SEVLINGS.filter(s=>!game.unlockedSevlings.includes(s.id));
    if(!locked.length){ state.settingsMessage = 'All Sevlings are already unlocked.'; render(); return; }
    const won = locked[Math.floor(Math.random()*locked.length)];
    game.unlockedSevlings.push(won.id);
    game.sevlingCare[won.id] = { happiness:50, accessories:[] };
    await saveGame();
    state.settingsMessage = `Unlocked ${won.name} for testing.`;
    render();
  };
  document.getElementById('btn-save-settings').onclick = async ()=>{
    const geminiVal = document.getElementById('gemini-key').value.trim();
    const cfgText = document.getElementById('firebase-config').value.trim();
    state.firebaseConfigDraft = cfgText;
    state.error = ''; state.settingsMessage = '';
    if(authUser && geminiVal !== settings.geminiKey){
      const ok = await saveFamilyGeminiKey(geminiVal);
      if(ok) settings.geminiKey = geminiVal;
      else { render(); return; }
    }
    const inviteVal = document.getElementById('invite-code').value.trim();
    if(authUser && inviteVal && inviteVal.toUpperCase() !== (settings.inviteCode||'').toUpperCase()){
      const ok2 = await saveFamilyInviteCode(inviteVal);
      if(ok2) settings.inviteCode = inviteVal.toUpperCase();
      else { render(); return; }
    }
    if(authUser && state.currentProfileId){
      const esVal = document.getElementById('voice-es').value;
      const enVal = document.getElementById('voice-en').value;
      const newPrefs = {};
      if(esVal){ const [name, lang] = esVal.split('|').map(decodeURIComponent); newPrefs.es = { name, lang }; }
      if(enVal){ const [name, lang] = enVal.split('|').map(decodeURIComponent); newPrefs.en = { name, lang }; }
      if(JSON.stringify(newPrefs) !== JSON.stringify(settings.voicePrefs || {})){
        const ok3 = await saveVoicePrefs(newPrefs);
        if(ok3) settings.voicePrefs = newPrefs;
        else { render(); return; }
      }
    }
    if(cfgText){
      const parsed = parseFirebaseConfigText(cfgText);
      if(!parsed){
        state.error = "Couldn't find a valid Firebase config in that text, make sure you pasted the whole snippet.";
        render(); return;
      }
      settings.firebaseConfig = parsed;
      const ok = initFirebase(parsed);
      if(!ok){
        state.error = 'That Firebase config looks right, but the connection could not be started.';
        render(); return;
      }
    }
    saveSettingsToStorage();
    state.settingsMessage = 'Settings saved.';
    if(!authUser) state.view = 'login';
    render();
  };
}

init();
</script>
</body>
</html>
